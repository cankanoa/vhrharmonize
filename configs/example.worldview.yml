  #   OUTPUT_SCALE: 10000.0 # float; default: ENVI task/metadata-derived value.
  #   CALIBRATION_FILE: /path/to/calibration.txt # enviuri; default: ENVI task/metadata-derived value.
  #   CALIBRATION_FORMAT: "ENVI" # ASCII | ENVI | Discrete | Filter | FLAASH; default: flaash.
  #   CALIBRATION_UNITS: Microns # Nanometers | Microns; default: ENVI task/metadata-derived value.
  #   LAT_LONG: [0.0, 0.0] # float; default: ENVI task/metadata-derived value.
  #   SENSOR_ALTITUDE: 617.0 # float; default: ENVI task/metadata-derived value.
  #   DATE_TIME: "2026-01-01T00:00:00Z" # envitime; default: ENVI task/metadata-derived value.
  #   USE_ADJACENCY: Wavelength-dependent scattering kernel # Disabled | Legacy exponential scattering kernel | Wavelength-dependent scattering kernel; default: Wavelength-dependent scattering kernel.
  #   DEFAULT_VISIBILITY: 20.0 # float; default: default_visibility (Python: null; ENVI: 40.0).
  #   USE_POLISHING: Disabled # Disabled | Polish using reference materials | Polish using statistical detection of spectral artifacts; default: Disabled.
  #   POLISHING_RESOLUTION: 100.0 # uint; default: ENVI task/metadata-derived value.
  #   SENSOR_AUTOCALIBRATION: false # boolean; default: true.
  #   SENSOR_CAL_PRECISION: 0.01 # float; default: 0.15000001.
  #   SENSOR_CAL_FEATURE_LIST: [] # string; default: ENVI task/metadata-derived value.
  #   GROUND_ELEVATION: 0.5 # float; default: sampled DEM percentile / 1000 (km).
  #   SOLAR_AZIMUTH: 180.0 # float; default: explicit variables.solar_azimuth.
  #   SOLAR_ZENITH: 30.0 # float; default: explicit variables.solar_zenith.
  #   LOS_AZIMUTH: 90.0 # float; default: explicit variables.line_of_sight_azimuth.
  #   LOS_ZENITH: 10.0 # float; default: explicit variables.line_of_sight_zenith.
  #   IFOV: 0.002 # float; default: ENVI task/metadata-derived value.
  #   MODTRAN_ATM: "Mid-Latitude Summer" # Tropical Atmosphere | Mid-Latitude Summer | Mid-Latitude Winter | Sub-Arctic Summer | Sub-Arctic Winter | 1976 US Standard Atmosphere; default: modtran_atm (Python: Mid-Latitude Summer; ENVI: Tropical Atmosphere).
  #   MODTRAN_AER: "Maritime" # No Aerosol | High-Visibility Rural | Low-Visibility Rural | Maritime | Urban | Tropospheric; default: modtran_aer (Python: Rural; ENVI: High-Visibility Rural).

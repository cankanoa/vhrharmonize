# Orthorectify multispectral imagery with the source RPC model and a DEM.
orthorectify_mul:
  plugin: orthorectification
  core:run: true # true | false; default: false. Enable this step.
  # core:require_outputs: param:output_image_path # Default: false. Uncomment to request this output explicitly.
  param:input_image_path: var:current_image_paths # path; required.
  param:dem_image_path: const:dem_path # path; required. Or var:dem from fetch_dem.
  # param:gcp_geojson_file_path: /path/to/rpc_refinement_gcps.geojson # path | null; default: null. Refine RPCs with Orthority-format GCPs.
  # GCP format: https://orthority.readthedocs.io/en/stable/file_formats/oty_gcps.html
  var:suffix: expr:var.suffix & '_ortho'
  var:current_image_paths: expr:const.temp_dir & '/orthorectification/' & var.basename & var.suffix & '.tif'
  param:output_image_path: var:current_image_paths # path; required.
  var:orthorectified_mul_path: var:current_image_paths # Retain MUL imagery for cloud-mask prediction after pansharpening.
  param:output_resolution: var:product_resolution # positive number | [x,y] | null; default: null/native. CRS units; use null for a geographic CRS.
  # param:output_epsg: 6635 # EPSG integer; default: shared.epsg; required without shared.epsg.
  # param:custom_nodata_value: -9999 # number | null; default: shared.custom_nodata_value (Python: null).
  # param:output_dtype: int16 # raster dtype | null; default: shared.output_dtype (Python: source dtype).
  # param:log_to_console: false # true | false; default: false. Processing-function logs; core logging is separate.
  # param:scene_basename: var:basename # string | null; default: null. Explicit scene label for logs.
  # core:calculate_overviews: true # true | false; default: false.

# The same plugin runs again under a different, unique step name.

orthorectify_pan:
  plugin: orthorectification
  core:run: true # true | false; default: false. Enable this step.
  # core:require_outputs: param:output_image_path # Default: false. Uncomment to request this output explicitly.
  core:requires: var:pan_companions # path list; default: []. External PAN RPC sidecars.
  param:input_image_path: var:pan # path; required.
  param:dem_image_path: const:dem_path # path; required. Or var:dem from fetch_dem.
  param:output_resolution: var:pan_product_resolution # PAN IMD meanProductGSD; pansharpening inherits this grid.
  var:pan: expr:const.temp_dir & '/orthorectification/' & var.basename & '_pan_ortho.tif'
  param:output_image_path: var:pan # path; required.
  # All orthorectification options listed above also apply here.

# Pansharpen corrected multispectral data with orthorectified PAN data.
pansharpen:
  plugin: pansharpen
  core:run: true # true | false; default: false. Enable this step.
  # core:require_outputs: param:output_image_path # Default: false. Uncomment to request this output explicitly.
  param:input_low_resolution_path: var:current_image_paths # path; required.
  param:input_high_resolution_path: var:pan # path; required.
  var:suffix: expr:var.suffix & '_pansharpen'
  var:current_image_paths: expr:const.temp_dir & '/pansharpen/' & var.basename & var.suffix & '.tif'
  param:output_image_path: var:current_image_paths # path; required.
  # param:custom_nodata_value: -9999 # number | null; default: shared.custom_nodata_value (Python: null).
  # param:log_to_console: false # true | false; default: false. Processing-function logs; core logging is separate.
  # param:scene_basename: var:basename # string | null; default: null. Explicit scene label for logs.
  # core:calculate_overviews: true # true | false; default: false.

# Predict clouds on orthorectified MUL imagery and mask the pansharpened raster. Band indices are one-based.
cloud_mask:
  plugin: cloud_mask
  core:run: true # true | false; default: false. Enable this step.
  # core:swap_for_temp_file: [input_image_path, inference_image_path, output_raster_path, output_mask_path] # File parameters to process through local UUID copies.
  # core:require_outputs: [param:output_raster_path, param:output_mask_path] # Requested deliverables; upstream steps run as needed.
  param:input_image_path: var:current_image_paths # path; required.
  param:inference_image_path: var:orthorectified_mul_path # path | null; default: null. Predict on this raster; null uses input_image_path. Mask is applied to input_image_path.
  var:cloudmask: expr:var.relative_output_dir & '/' & var.basename & var.suffix & '_cloudmask.tif'
  var:suffix: expr:var.suffix & '_cloudmasked'
  var:current_image_paths: expr:var.relative_output_dir & '/' & var.basename & var.suffix & '.tif'
  param:output_raster_path: var:current_image_paths # path; required. Or a path under const.temp_dir when only an intermediate.
  param:output_mask_path: var:cloudmask # path; required. Binary mask; may use const:temp_dir if not a deliverable.
  param:red_band_index: const:red_band_index # one-based integer; required. WorldView red.
  param:green_band_index: const:green_band_index # one-based integer; required. WorldView green.
  param:nir_band_index: const:nir_band_index # one-based integer; required. WorldView NIR1.
  # param:cloud_classes: [1, 2, 3] # integer list; default: [1,2,3]. Classes treated as clouds/shadows.
  param:buffer_pixels: 10 # integer >= 0; default: 0. Buffer cloud mask outward; the previous example used 10.
  # param:inference_resolution_m: 10.0 # positive meters | null; default: 10.0. null keeps input grid for inference.
  # param:cloud_mask_value: 1 # integer; default: 1. Binary value to mask when applying the cloud mask.
  # param:custom_nodata_value: -9999 # number | null; default: shared.custom_nodata_value (Python: source nodata).
  # param:allow_mask_reprojection: true # true | false; default: true. Reproject a mask to the image grid if needed.
  # param:omnicloud_kwargs: # object | null; default: null. Forward additional predict_from_array options.
  #   inference_device: null # cpu | cuda | mps | null; default: null -> automatic device selection. Example: cuda.
  #   mosaic_device: cpu # cpu | cuda | mps | null; default: cpu in this plugin (upstream: inference device).
  #   batch_size: 1 # positive integer; default: 1.
  #   patch_size: 1000 # positive integer; default: 1000. Previous tuning example: 768.
  #   patch_overlap: 300 # nonnegative integer; default: 300. Previous tuning example: 192.
  #   inference_dtype: float32 # float32 | float16 | bfloat16; default: float32.
  #   export_confidence: false # true | false; default: false. Confidence cubes are converted to class labels before binary masking.
  #   softmax_output: true # true | false; default: true. Applies when export_confidence is enabled.
  #   no_data_value: 0 # number; default: 0. Inference-array nodata.
  #   apply_no_data_mask: true # true | false; default: true.
  #   custom_models: null # torch model/list | null; default: null. Live models are Python-only.
  #   pred_classes: 4 # positive integer; default: 4. Class count for custom models.
  #   destination_model_dir: null # path | null; default: null -> OmniCloudMask cache directory.
  #   model_download_source: hugging_face # hugging_face | google_drive; default: hugging_face.
  #   compile_models: false # true | false; default: false.
  #   compile_mode: default # default | reduce-overhead | max-autotune | max-autotune-no-cudagraphs; default: default.
  #   model_version: null # model version | null; default: null -> latest available. Examples: 1.0, 2.0, 3.0, 4.0.
  # param:log_to_console: false # true | false; default: false. Processing-function logs; core logging is separate.
  # param:scene_basename: var:basename # string | null; default: null. Explicit scene label for logs.
  # core:calculate_overviews: true # true | false; default: false.


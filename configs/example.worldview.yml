  param:footprint_geometry: var:geometry # GeoJSON geometry | null; default: null. Footprint used for DEM sampling.
  # Explicit connections from the imported scene and sensor constants to Py6S arguments.
  # param:variables: null # object | null; default: null. Optional mapped values instead of direct sensor arguments.
  param:solar_zenith: var:solar_zenith # degrees; required unless supplied in an explicit variables object.
  param:solar_azimuth: var:solar_azimuth # degrees; required unless supplied in an explicit variables object.
  param:view_zenith: var:view_zenith # degrees; required unless supplied in an explicit variables object.
  param:view_azimuth: var:view_azimuth # degrees; required unless supplied in an explicit variables object.
  param:day: var:day # 1..31; required unless supplied in an explicit variables object.
  param:month: var:month # 1..12; required unless supplied in an explicit variables object.
  param:wavelengths_response_csv: var:wavelengths_response_csv # CSV path; original wavelength_nm samples, response columns in raster band order.

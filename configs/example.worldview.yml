  # param:custom_params: # object | null; default: null. Override metadata-derived ENVI task settings below.
  #   # Choices/task defaults below come from docs/flaash_params_info.txt; ENVI versions may differ.
  #   # Calibration units describe wavelength units; INPUT_SCALE converts radiance to uW/(cm^2 sr nm).
  #   # Native task defaults can be overridden by the metadata-derived values noted here.
  #   INPUT_RASTER: {url: /path/to/input, factory: URLRaster} # enviraster; default: ENVI task/metadata-derived value.

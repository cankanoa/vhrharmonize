# This file has arguments to process WorldView-3 B1 images and brief setup instructions below.
# WorldView naming, metadata standardization and calibration are defined here.
#
# 1. Install the required system libraries:
#    conda create -n vhrharmonize -c conda-forge gdal sixs python=3.11
#    conda activate vhrharmonize
# 2. Install the library:
#    From source: pip install -e ".[defaults]"
#    From PyPI: pip install "vhrharmonize[defaults]"
# 3. Set the paths, metadata mappings and non-default arguments below.
# 4. From the repository: vhr workflow --config configs/example.worldview.yml
#    From this folder: vhr workflow --config example.worldview.yml
#    Preview pending work by adding --dry-run.
#
# Commented options show defaults or optional examples. "default: shared.X" means
# the workflow inherits X; "Python:" gives the standalone function default when different.
# Do not uncomment every option: choose the method/steps you need and edit their values.
# Top-level keys are unique step names. plugin: selects the implementation; steps run in declaration order.
# Keys: param:name passes a function argument; var:name assigns a scene variable;
# const:name assigns a workflow-wide variable; core:name controls execution.
# Values: var:name/const:name read those scopes; expr:... evaluates JSONata;
# returned:field reads a function result; collect:name gathers a field across scenes.
# literal:text escapes a reserved prefix; returned:$ selects the complete result.
# JSONata sees one object: {"const": {...}, "var": {...}}. Use const.name / var.name.
# var: assignments evaluate separately for each scene, including in aggregate steps.
# Aggregate returned: assignments to var: map a list in scene order or a dictionary keyed by scene ID.
# Each scene stores its own value; collect:name reads the current values in scene order.
# Unquoted prefixes work in YAML. Use >- for expressions containing a colon followed by a space.
# YAML defines directory roots; import_files resolves metadata relative to each discovered file.
# Pass absolute input paths to processing functions. Output paths must be unique.
# File descriptor fields become scene variables; mul, source and scene_id are explicit mappings below.
# Suffix assignments run before path expressions; disabled steps perform no assignments or I/O.
# Image steps read current_image_paths before updating it; disabled steps retain the previous path.
# current_image_paths is one path per scene; aggregate function parameters use collect:current_image_paths.
#
# Context fields only reach functions through explicit param: links.
# Precedence: per-step param > shared param > Python function default. core: controls are not function defaults.
# Each plugin independently selects paths for core file features in its Python adapter.
# The controls below enable those selected features; they do not select additional paths.
# Every processing plugin accepts these runner controls alongside its param: settings:
#   core:run: false # true | false; default: false. Enable explicitly.
#   core:scope: var # var | aggregate; default: plugin scope; scene setters always aggregate.
#   core:processing_direction: vertical # horizontal | vertical; default: shared.core:processing_direction.
#   core:requires: [] # path/list; default: []. Extra file dependencies, not function arguments.
#   core:calculate_overviews: false # true | false; default: false. Selected raster outputs; requires shared.param:window_scales.
#   core:reuse: true # true | false; default: shared.core:run_from_existing.
#   core:check_validity: true # true | false; default: shared.core:check_validity.
#   core:require_outputs: false # false | true | param:name | [param:name, ...]; default: false. Request these outputs regardless of their directory.
# core:require_outputs selects deliverables. A valid cached downstream output stops
# upstream recomputation; missing intermediate temporary files do not prevent resume.

shared:
  plugin: shared
  core:run: true # true | false; default: false. Apply workflow-wide defaults.
  # core:protect_source_files: true # true | false; default: true. Protect imported originals and companion files.
  core:output_metadata_path: expr:var.relative_output_dir & '/' & var.scene_id & '_processing_metadata.json' # One metadata file per scene, locally and on HPC.
  # core:delete_final_json_first: true # true | false; default: true. Replace old JSON on the first write to each resolved path; append subsequent completions.
  # Shared parameters are offered to every function that accepts them; no shared defaults exist.
  # Set shared values directly; per-step param: settings override them.
  param:window_scales: [2, 4, 8, 16, 32, 64, 128, 256, 512] # increasing integer list; default: NA. Required for VHR core overviews.
  param:epsg: 8857 # EPSG integer; default: NA. Projected output CRS; 6635 is Hawaii Island. 8857 is Equal Earth. Must be a projected CRS.
  param:custom_nodata_value: -9999 # number | null; default: NA. Output NoData value.
  param:output_dtype: int16 # raster dtype; default: NA. Output raster data type.

  # Common SpectralMatch function options also use ordinary shared parameters.
  param:window_size: 1024 # positive integer | null; default: NA. Processing/output tile size.
  param:io_threads: 1 # cpu | positive integer | null; default: NA. Raster IO workers.
  # param:cache: null # positive GB | null; default: NA. null keeps the existing GDAL cache.
  # param:calculation_dtype: float32 # raster dtype; default: NA.
  # param:save_as_cog: false # true | false; default: NA.
  # param:debug_logs: false # true | false; default: NA.
  # param:resume_from_outputs: "no" # no | yes | validate; default: NA. Native reuse; core reuse is separate.
  # VHR calculates overviews after the selected steps. Leave native build_overviews unset.

  # core:concurrent_processing_backend: process_pool # process_pool | dask; default: process_pool.
  core:worker_error_case: remove_and_restart # error | remove_instence | remove_and_restart; default: error. Remove failed images; remove_and_restart also retries attributable aggregate failures. Reuse settings still apply.
  core:tile_threads: 1 # positive integer | cpu | null; default: 1. Threads within each image.
  core:concurrent_processing: 1 # positive integer | num_cpu; default: 1. Concurrent scene/image jobs; must be 1 for Dask.
  # Dask uses a running scheduler; search "When dask is enabled" in the Slurm template.
  # core:dask_scheduler: [file, ~/koa_scratch/vhrharmonize/run_{run_id}/logs/{run_id}_dask_scheduler.json] # [file, path] | [address, URL] | null; default: null.

  # core:delete_temp_dir: false # true | false; default: false. Clean owned temporary outputs after success.
  # core:delete_temp_steps_proactively: true # true | false; default: true. Clean completed intermediates during processing.
  # core:processing_direction: vertical # horizontal | vertical; default: vertical. Advance each scene until a synchronization point; horizontal runs by step.
  # core:run_from_existing: true # true | false; default: true. Reuse required outputs at each step.
  # core:check_validity: true # true | false; default: true. Verify raster readability, TIFF bounds and JSON syntax.
  # core:validity_check_grid_size: 2048 # integer >= 0; default: 2048. 0 disables sampling; 1 checks every pixel; N samples one pixel per NxN cell.
  # core:log_to_console: true # true | false; default: true.
  # core:show_progress: true # true | false; default: true. Live prompt_toolkit dashboard; one final summary in redirected logs.
  # core:report_progress: false # true | false; default: false. Publish progress snapshots without a display; show_progress also enables this.
  # core:save_statistics_path: statistics.jsonl # path | null; default: statistics.jsonl beside this YAML. Append raw timings; null disables saving.
  # core:load_statistics_path: statistics.jsonl # path | null; default: statistics.jsonl beside this YAML. Seed ETAs from past timings; null disables loading.
  param:log_to_console: true # true | false; default: NA. Use this to pass logging preferences to the plugins.
  # Any function setting can be shared here; a matching per-step setting overrides it.

  core:cleanup_dirs: [const:temp_dir] # Cleanup roots; default: []. Requested outputs and sources stay protected.
  core:swap_temp_dir: const:temp_dir # Local folder for core:swap_for_temp_file copies; default: null.
  # Workflow-wide constants. They remain available to every scene and aggregate.
  const:red_band_index: 5 # one-based integer; recipe setting. WorldView red.
  const:green_band_index: 3 # one-based integer; recipe setting. WorldView green.
  const:nir_band_index: 7 # one-based integer; recipe setting. WorldView NIR1.

discover_inputs:
  plugin: import_files
  # Explicit persistence only. Missing load files warn (when logs are on), then discovery continues.
  # To refresh from the original metadata, leave load_context commented during that run.
  # core:load_context:
  #   "path:expr:const.temp_dir & '/context/import_metadata.json'": all
  # core:save_context:
  #   "path:expr:const.temp_dir & '/context/import_metadata.json'": all
  # core:load_upsert_context: {"path:expr:const.temp_dir & '/context/metadata.json'": [var.metadata]}
  # core:save_upsert_context: {"path:expr:const.temp_dir & '/context/metadata.json'": [var.metadata]}
  # dependencies selects recursive param references; defined selects this step's assignments.
  # all saves/loads every context field; a successful load skips rediscovery and saving.
  core:run: true # true | false; default: false. Enable this step.
  # Later import_files steps add scenes and missing metadata fields; existing values and roots are preserved.
  # Output filenames are defined by YAML expressions; functions receive complete explicit paths.
  # Define hard coded path variables
  const:output_dir: path:./output # Shared products, including the final mosaic; relative to this YAML.
  const:temp_dir: path:./temp # Stable root for intermediates and saved context.
  var:relative_output_dir: path:expr:$replace(var.file_path, /[^\/]+$/, '') & '../../processed' # Per-scene output root, resolved from the original input.
  const:dem_path: path:/path/to/dem.tif # path; recipe setting. Shared local DEM; fetch_dem replaces this when enabled.
  const:reference_path: path:/path/to/reference.tif # path; recipe setting. Alignment reference; may share an HPC folder with the DEM.

  # Sensor constants shared by all imported images.
  const:band_order: [BAND_C, BAND_B, BAND_G, BAND_Y, BAND_R, BAND_RE, BAND_N, BAND_N2]
  # Original 1 nm spectral responses; columns follow const:band_order.
  # Select exactly one spectral parameter in py6s_atmospheric_correction; CSV format/sources: docs/cli/workflow.md.
  const:spectral_response_csv:
    WV02: path:./example.worldview2.response.csv
    WV03: path:./example.worldview3.response.csv
  # 2018v0 gain/offset adjustments. Edit or replace these values per product.
  const:calibration:
    WV02:
      BAND_C: [1.203, -11.839]
      BAND_B: [1.002, -9.835]
      BAND_G: [0.953, -7.218]
      BAND_Y: [0.946, -5.675]
      BAND_R: [0.955, -5.046]
      BAND_RE: [0.980, -6.114]
      BAND_N: [0.966, -5.096]
      BAND_N2: [1.010, -4.059]
    WV03:
      BAND_C: [0.938, -13.099]
      BAND_B: [0.946, -9.409]
      BAND_G: [0.958, -7.771]
      BAND_Y: [0.979, -5.489]
      BAND_R: [0.969, -4.579]
      BAND_RE: [1.027, -5.552]
      BAND_N: [0.977, -6.508]
      BAND_N2: [1.007, -3.699]

  param:search_glob: /path/to/worldview/**/MUL/*-M1BS-*.TIF

  param:scene_id: literal:expr:$replace($split(var.file_path, '/')[-1], /\.[^.]*$/, '') # string/reference/expression; default: var:file_path. Filename stem; later imports merge on this ID.
  # Extended-glob alternative for selecting named primary MUL products:
  # param:search_glob: "/path/to/worldview/**/MUL/@(\
  # 17DEC08211835-M1BS-016445318010_01_P011*|\
  # 19SEP09211403-M1BS-200011908666_01_P001*\
  # ).TIF"
  # search_glob also accepts a list of patterns. Select primary MUL images;
  # PAN companions are derived below rather than creating duplicate records.
  # Cached outputs are discovered at each step's declared path. Keep the raw
  # search glob when resuming from cloud masking; earlier temporary files may be absent.
  # Relative companion paths resolve from the discovered file's directory.
  # literal:expr delays evaluation until each file is found; var:file_path is always available.
  # Imported fields become var fields directly. YAML mappings run after discovery.
  param:create_metadata_json: # name:{path: glob} | name:{to_json: file}; default: null.
    mul_companions:
      path: literal:expr:$replace(var.file_path, '.TIF', '.{RPB,rpb}') # Sorted paths; [] if no matches.
    pan_companions:
      path: literal:expr:$replace($replace($replace(var.file_path, '_MUL/', '_PAN/'), '-M1BS-', '-P1BS-'), '.TIF', '.{RPB,rpb}')
    metadata:
      to_json: literal:expr:$replace(var.file_path, '.TIF', '.IMD') # IMD/JSON/GeoJSON/XML/YAML -> object; kept in memory.
    pan_metadata:
      to_json: literal:expr:$replace($replace($replace(var.file_path, '_MUL/', '_PAN/'), '-M1BS-', '-P1BS-'), '.TIF', '.IMD')
  var:mul: returned:file_path # Original multispectral image; retained for source metadata.
  var:metadata_path: expr:$replace(var.mul, '.TIF', '.IMD') # Source metadata file; enables an individual HPC mapping.
  var:current_image_paths: returned:file_path # Current image for this scene; updated by enabled image steps.
  var:basename: expr:$replace($split(var.file_path, '/')[-1], /\.[^.]*$/, '') # Original filename without extension.
  var:suffix: "" # Naming state; enabled processing steps append their suffixes in YAML.
  var:pan: expr:$replace($replace(var.mul, '_MUL/', '_PAN/'), '-M1BS-', '-P1BS-')
  var:sensor_id: var:metadata.IMAGE_1.satId
  var:wavelengths_response_csv: expr:$lookup(const.spectral_response_csv, var.sensor_id)
  var:acquisition_datetime_utc: expr:var.metadata.IMAGE_1.firstLineTime ?? var.metadata.IMAGE_1.TLCTime
  var:day_utc: expr:$substring(var.acquisition_datetime_utc, 0, 10)
  var:day: expr:$number($substring(var.acquisition_datetime_utc, 8, 2))
  var:month: expr:$number($substring(var.acquisition_datetime_utc, 5, 2))
  var:solar_azimuth: var:metadata.IMAGE_1.meanSunAz
  var:solar_zenith: expr:90 - var.metadata.IMAGE_1.meanSunEl
  var:view_azimuth: var:metadata.IMAGE_1.meanSatAz
  var:view_zenith: expr:90 - var.metadata.IMAGE_1.meanSatEl
  var:line_of_sight_azimuth: var:metadata.IMAGE_1.meanSatAz
  var:line_of_sight_zenith: expr:180 - var.metadata.IMAGE_1.meanOffNadirViewAngle
  var:cloud_cover: expr:100 * var.metadata.IMAGE_1.cloudCover
  var:product_resolution: var:metadata.IMAGE_1.meanProductGSD
  var:pan_product_resolution: var:pan_metadata.IMAGE_1.meanProductGSD
  var:dn_to_radiance_factors: expr:$map(const.band_order, function($band){$lookup(var.metadata, $band).absCalFactor / $lookup(var.metadata, $band).effectiveBandwidth * $lookup($lookup(const.calibration, var.sensor_id), $band)[0]})
  var:dn_to_radiance_offsets: expr:$map(const.band_order, function($band){$lookup($lookup(const.calibration, var.sensor_id), $band)[1]})
  var:min_lon: expr:$min([var.metadata.BAND_C.ULLon, var.metadata.BAND_C.URLon, var.metadata.BAND_C.LRLon, var.metadata.BAND_C.LLLon])
  var:max_lon: expr:$max([var.metadata.BAND_C.ULLon, var.metadata.BAND_C.URLon, var.metadata.BAND_C.LRLon, var.metadata.BAND_C.LLLon])
  var:min_lat: expr:$min([var.metadata.BAND_C.ULLat, var.metadata.BAND_C.URLat, var.metadata.BAND_C.LRLat, var.metadata.BAND_C.LLLat])
  var:max_lat: expr:$max([var.metadata.BAND_C.ULLat, var.metadata.BAND_C.URLat, var.metadata.BAND_C.LRLat, var.metadata.BAND_C.LLLat])
  var:geometry:
    type: Polygon
    coordinates:
      - - [var:metadata.BAND_C.ULLon, var:metadata.BAND_C.ULLat]
        - [var:metadata.BAND_C.URLon, var:metadata.BAND_C.URLat]
        - [var:metadata.BAND_C.LRLon, var:metadata.BAND_C.LRLat]
        - [var:metadata.BAND_C.LLLon, var:metadata.BAND_C.LLLat]
        - [var:metadata.BAND_C.ULLon, var:metadata.BAND_C.ULLat]
  var:footprint_metadata:
    scene_id: var:scene_id
    sensor_id: var:sensor_id
    acquisition_datetime_utc: var:acquisition_datetime_utc
    cloud_cover: var:cloud_cover
    solar_zenith: var:solar_zenith
    view_zenith: var:view_zenith
    geometry: var:geometry
  param:where: literal:expr:100 * var.metadata.IMAGE_1.cloudCover <= 75 # bool/expression; default: true. Maximum cloud cover percent.


# Copy source files and explicitly selected companions before processing.
file_source:
  plugin: file_source
  core:run: false # true | false; default: false. Skip this step and retain the previous image path.
  # core:require_outputs: param:output_path # Default: false. Uncomment to request this output explicitly.
  param:input_path: var:current_image_paths # path; required.
  param:companions: var:mul_companions # path list | null; default: null. Copy RPC sidecars with the image.
  var:suffix: expr:var.suffix & ''
  var:current_image_paths: expr:const.temp_dir & '/file_source/' & var.basename & var.suffix & '.tif'
  param:output_path: var:current_image_paths # path; required. Replaces the current image when enabled.
  # Enabling this step automatically supplies the copied image to subsequent steps.
  # Alternative output path: expr:const.temp_dir & '/file_source/' & $split(var.file_path, '/')[-1]
  # core:calculate_overviews: true # true | false; default: false.

# Optional online DEM. Otherwise set discover_inputs.const:dem_path for correction and both ortho steps.
# The DEM should contain WGS84 ellipsoidal heights in meters:
# https://portal.opentopography.org/raster?opentopoID=OTSRTM.082016.4326.1
# Enable to download one DEM covering all imported images; downstream const:dem_path links already use it.
# For per-scene DEMs: set scope to var, image_paths to var:current_image_paths, define var:dem as a unique path,
# and use var:dem for output_tif_path and downstream DEM inputs.
fetch_dem:
  plugin: fetch_dem
  core:run: false # true | false; default: false.
  # core:require_outputs: param:output_tif_path # Default: false. Uncomment to request this output explicitly.
  core:scope: aggregate # scene | aggregate; default: scene. Fetch once for the combined image extent.
  param:image_paths: collect:current_image_paths # path | path list | null; default: null. Union of image bounds, transformed to WGS84.
  # param:min_lon: null # number | null; default: null. Alternative bbox west edge; omit image_paths and supply all four edges.
  # param:min_lat: null # number | null; default: null. Alternative bbox south edge.
  # param:max_lon: null # number | null; default: null. Alternative bbox east edge.
  # param:max_lat: null # number | null; default: null. Alternative bbox north edge.
  const:dem_path: expr:const.temp_dir & '/fetch_dem/dem.tif'
  param:output_tif_path: const:dem_path # path; required. Shared by correction and both orthorectification steps.
  # param:api_key: null # string | null; default: OPENTOPOGRAPHY_API_KEY or OT_API_KEY environment variable.
  param:demtype: SRTMGL1_E # OpenTopography DEM identifier; default: SRTMGL1_Ellip.
  # param:endpoint: https://portal.opentopography.org/API/globaldem # URL; default shown.
  # param:timeout_s: 120.0 # positive seconds; default: 120.0.
  # param:log_to_console: false # true | false; default: false. Processing-function logs; core logging is separate.
  # param:scene_basename: null # string | null; default: null. Optional log label; use var:basename in scene scope.

# Fetch atmosphere separately so it can be reused or replaced by another source.
fetch_atmosphere:
  plugin: fetch_atmosphere
  # Optional explicit metadata reuse; no implicit output sidecars or restore hooks.
  # core:save_context:
  #   "path:expr:var.relative_output_dir & '/context/' & var.basename & '_atmosphere.json'": var.atmosphere
  # core:load_context:
  #   "path:expr:var.relative_output_dir & '/context/' & var.basename & '_atmosphere.json'": var.atmosphere
  core:run: true # true | false; default: false. Enable this step.
  # core:require_outputs: param:output_path # Default: false. Uncomment to request this output explicitly.
  # param:source: nasa_power # nasa_power | modis_gee; default: nasa_power.
  # Missing retrieval values use these explicit defaults; warnings and substitutions are saved in the atmosphere JSON.
  param:fallback_values:
    aot550: 0.2
    water_vapor: 2.5 # g/cm^2
    ozone_cm_atm: 0.3 # cm-atm
  param:day_utc: var:day_utc  # ISO date; required for nasa_power.
  param:min_lon: var:min_lon  # number; required. WGS84 bbox west edge.
  param:min_lat: var:min_lat  # number; required. WGS84 bbox south edge.
  param:max_lon: var:max_lon  # number; required. WGS84 bbox east edge.
  param:max_lat: var:max_lat  # number; required. WGS84 bbox north edge.
  var:atmosphere_json: expr:const.temp_dir & '/fetch_atmosphere/' & var.basename & '_atmosphere.json'
  param:output_path: var:atmosphere_json # path; required.
  var:atmosphere: returned:$ # Complete JSON object returned by the atmosphere function.
  # param:grid_size: 3 # integer >= 1; default: 3. Sample points per bbox side.
  # param:search_days: 1 # integer >= 0; default: 1. Search +/- this many days.
  # param:timeout_s: 30.0 # positive seconds; default: 30.0.
  # param:endpoint: https://power.larc.nasa.gov/api/temporal/daily/point # URL; default shown.
  # param:log_to_console: false # true | false; default: false. Processing-function logs; core logging is separate.
  # param:scene_basename: var:basename # string | null; default: null. Explicit scene label for logs.

  # For source: modis_gee, remove day_utc and NASA-only options above, then use:
  # param:scene_datetime_utc: var:acquisition_datetime_utc # ISO datetime; required for modis_gee.
  # param:ee: null # Python client | null; default: null. Initialized automatically; live objects are Python-only.
  # param:ee_project: null # string | null; default: null. Or GEE_PROJECT/EE_PROJECT/GOOGLE_EARTH_ENGINE_PROJECT in env_file.
  # param:authenticate: false # true | false; default: false. Run Earth Engine authentication when needed.
  # param:env_file: /path/to/.env # path | null; default: null. Optional Earth Engine project settings.
  # param:hours_window: 24 # integer hours; default: 24. Scene-time search window.
  # param:terra_collection: MODIS/061/MOD08_D3 # GEE collection; default shown.
  # param:aqua_collection: MODIS/061/MYD08_D3 # GEE collection; default shown.
  # param:band_name: Atmospheric_Water_Vapor_Mean # water-vapor band; default shown.
  # param:aod_band_candidates: null # band-name list | null; default: null. Try known MODIS AOD names.
  # param:aod_scale_factor: 0.001 # number; default: 0.001.
  # param:modis_scale_factor: 0.001 # number; default: 0.001. Water vapor -> g/cm^2.
  # param:modtran_baseline_water_vapor: 2.92 # g/cm^2; default: 2.92. Denominator for FLAASH water-vapor preset.
  # param:reduce_scale_m: 1000 # meters; default: 1000. Earth Engine reduce-region scale.

# Py6S atmospheric correction. Geometry, band order and radiance calibration come from mapped JSON.
py6s_atmospheric_correction:
  plugin: py6s_atmospheric_correction
  core:run: true # true | false; default: false. Enable this step.
  # core:swap_for_temp_file: [input_raster] # File parameters to process through local UUID copies.
  # core:require_outputs: param:output_raster # Default: false. Uncomment to request this output explicitly.
  core:requires: var:mul_companions # path list; default: []. Preserve access to external RPC metadata.
  param:input_raster: var:current_image_paths # path; required. Previous enabled image step.
  param:dem_file_path: const:dem_path # path | null; default: null. Or var:dem from fetch_dem.
  var:suffix: expr:var.suffix & '_py6s'
  var:current_image_paths: expr:const.temp_dir & '/atmospheric_correction/' & var.basename & var.suffix & '.tif'
  param:output_raster: var:current_image_paths # path; required. Suffix is user-defined.
  # core:calculate_overviews: true # true | false; default: false.
  param:atmosphere_profile: user # user | tropical | midlatitude_summer | midlatitude_winter | subarctic_summer | subarctic_winter; default: midlatitude_summer.
  # param:aerosol_profile: maritime # maritime | continental | urban | desert | biomass_burning | stratospheric; default: maritime.
  param:aot550: var:atmosphere.aot550 # Retrieved value or explicitly recorded fallback; used when visibility_km is null.
  param:water_vapor: var:atmosphere.water_vapor # g/cm^2; retrieved value or recorded fallback.
  param:ozone: var:atmosphere.ozone_cm_atm # cm-atm; retrieved value or recorded fallback.
  param:output_scale_factor: 10000.0 # number | null; default: null. Reflectance scale applied before writing.
  # param:output_dtype: int16 # raster dtype; default: shared.output_dtype (Python: float32).
  # param:custom_nodata_value: -9999 # number | null; default: shared.custom_nodata_value (Python: source nodata).
  # param:visibility_km: null # kilometers | null; default: null. Example: 40.0; overrides aot550.
  # param:sixs_executable: null # executable path | null; default: SIXS_EXECUTABLE, then sixs/sixsV1.1 on PATH.
  # param:input_scale_factor: 1.0 # number; default: 1.0. Fallback when per-band radiance factors are absent.
  # param:clip_reflectance: true # true | false; default: true. Clip to [0,1] before output scaling.
  # param:ground_elevation_km: null # kilometers | null; default: null. Sample DEM, or 0 without DEM; example override: 0.5.

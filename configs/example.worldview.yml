#   # param:resume_from_outputs: "no" # no | yes | validate; default: "no". Recompute outputs with "no", reuse existing outputs with "yes", or validate existing outputs before reusing them with "validate"; default is "no". Inherits shared.param:resume_from_outputs when set.

# # Weighted seamlines. Ranking requires attributes in the input polygons.
# # Rank expressions use {field} placeholders, arithmetic, comparisons, and/or/not,
# # parentheses and abs/min/max/round/sqrt/log/log10/exp/sin/cos/tan. Example: -{cloud_cover} - {solar_zenith}.
# weighted_seamline:
#   plugin: weighted_seamline
#   core:run: true # true | false; default: false. Enable this step.
#   const:spectralmatch.mask: expr:const.temp_dir & '/weighted_seamline/weighted_seamline.gpkg'
#   param:input_polygons: const:footprints # path; required. Footprints and attributes from the selected footprint step.
#   param:output_mask: const:spectralmatch.mask # string; required. Output GeoPackage path for the ranked seamline polygons.
#   param:input_images: collect:current_image_paths # list | null; default: null. Optional raster folder, glob or paths for substring footprint matching; None infers names from the polygon field.
#   param:rank_function: "-{cloud_cover} - {solar_zenith}" # string; required. Ranking expression, required when steps includes weighted_seamline. Example: "-{cloud_cover} - {solar_zenith}".
#   param:image_field_name: const:spectralmatch.image_field_name # string; default: "image". Explicit setup value.
#   param:input_layer: const:spectralmatch.polygon_layer # string; default: "footprints". Defaults to "footprints" for explicit polygons; None selects their first layer; either inherits the preceding footprint step's layer when using its polygons.
#   # param:output_layer: "seamlines" # string; default: "seamlines".
#   # param:rank_descending: true # true | false; default: true.
#   # param:debug_logs: false # true | false; default: false. If True, prints ranking details. Inherits shared.param:debug_logs when set.
#   # param:resume_from_outputs: "no" # no | yes | validate; default: "no". Recompute outputs with "no", reuse existing outputs with "yes", or validate existing outputs before reusing them with "validate"; default is "no". Inherits shared.param:resume_from_outputs when set.

# Markov mesh seamlines. Raster costs and image quality determine the selected polygons.
markov_triangles:
  plugin: markov_triangles
  core:run: true # true | false; default: false. Enable this step.
  const:spectralmatch.mask: expr:const.temp_dir & '/markov_triangles/markov_triangles.gpkg'
  param:input_images: collect:current_image_paths # path list | glob/folder; required. Raster folder, glob or path list; basenames without extensions must be unique.
  param:output_mask: const:spectralmatch.mask # string; required. Output GeoPackage path, distinct from input vectors; stores image identifiers, image_path and raw quality_score.
  param:input_polygons: const:footprints # string | null; default: null. Optional valid-data footprints; None polygonizes band-1 GDAL masks, while supplied polygons must match every image and are never regenerated.
  param:input_layer: const:spectralmatch.polygon_layer # string; default: "footprints". Input footprint layer name; None selects the first layer.
  # param:output_layer: "seamlines" # string; default: "seamlines". Output polygon layer name; defaults to "seamlines".
  param:image_field_name: const:spectralmatch.image_field_name # string; default: "image". Footprint field containing each input basename without extension as a substring; matching pieces are dissolved using first-match attributes; defaults to "image". Explicit setup value.
  # param:image_rank_function: null # string | null; default: null. Optional footprint-attribute expression using weighted() syntax, e.g.
  # param:image_rank_descending: true # true | false; default: true. True favors larger quality scores, False favors smaller scores; defaults to True.
  # param:image_quality_weight: 1.0 # number; default: 1.0. Nonnegative multiplier of assigned area times globally min-max-normalized quality penalty; zero removes quality preference; defaults to 1.
  # param:edge_variables_weights_gsds_bands: [["laplacian_difference", 1.0, ["native"], [1]], ["laplacian_magnitude", 0.25, [100], [1]]] # list; default: [["laplacian_difference", 1.0, ["native"], [1]], ["laplacian_magnitude", 0.25, [100], [1]]]. Terms [name_or_path, nonnegative weight, GSD selection, band selection]; use [value] for one value or {"average" | "largest" | "smallest": [values]} for two or more; GSDs are positive integers in CRS units or "
  # param:foreground_path: null # string | null; default: null. Optional polygon mask forbidding seams through protected interiors; infeasible coverage raises ValueError.
  # param:foreground_layer: null # string | null; default: null. Optional layer in foreground_path; None reads the default layer.
  # param:mesh_spacing: 10 # number; default: 10. Positive mesh-cell width in CRS units, independent of cost GSDs; footprint boundaries constrain triangles; defaults to 10.
  # param:quadtree_max_images_per_leaf: 16 # number; default: 16. Positive label-count target for quadtree leaves; defaults to 16.
  # param:quadtree_overlap: 0.1 # number; default: 0.1. Child-block overlap fraction in (0, 0.5); defaults to 0.1.
  # param:quadtree_max_depth: 8 # number; default: 8. Nonnegative quadtree subdivision limit; defaults to 8.
  # param:solver_max_iterations: 50 # number; default: 50. Positive graph-cut sweep limit per node; defaults to 50; reaching the limit warns.
  # param:image_threads: null # cpu | positive integer | null; default: null. Local worker count, "cpu" or None for serial execution; defaults to None. Inherits shared.param:image_threads when set.
  # param:concurrent_processing_backend: "process_pool" # string; default: "process_pool". "process_pool" for local workers or "dask" for an existing cluster; defaults to "process_pool". Inherits shared.param:concurrent_processing_backend when set.
  # param:dask_scheduler: null # [file, path] | [address, URL] | null; default: null. Dask connection as ("file", path) or ("address", address); requires image_threads=None; defaults to None. Inherits shared.param:dask_scheduler when set.
  # param:debug_logs: false # true | false; default: false. Print node sizes and processing details; defaults to False. Inherits shared.param:debug_logs when set.
  # param:resume_from_outputs: "no" # no | yes | validate; default: "no". "no" recomputes, "yes" reuses existing output, "validate" checks the requested polygon layer; incomplete outputs always recompute. Inherits shared.param:resume_from_outputs when set.
  # External raster costs in edge_variables_weights_gsds_bands also need explicit core:requires paths.

# Clip rasters using the selected seamlines. The explicit requires link tracks the compound vector_mask file.
mask_rasters:
  plugin: mask_rasters
  core:run: true # true | false; default: false. Enable this step.
  core:calculate_overviews: true # true | false; default: false. VHR builds overviews using shared.param:window_scales.
  param:input_images: collect:current_image_paths # path list; required. Previous enabled image step.
  var:suffix: expr:var.suffix & '_masked'
  var:current_image_paths: expr:const.temp_dir & '/mask_rasters/' & var.basename & var.suffix & '.tif'
  core:requires: const:spectralmatch.mask
  param:output_images: collect:current_image_paths # path list | template/folder; required. Defines output files from a template path, folder, or list of paths (with the same length as the input).
  param:vector_mask: [include, const:spectralmatch.mask, const:spectralmatch.image_field_name] # [include|exclude, path, optional_field] | null; default: null. Example: [include, /path/to/seamline_mask.gpkg, image].
  # param:window_size: null # positive integer | null; default: null. Tile size for processing tiles. Inherits shared.param:window_size when set.
  # param:debug_logs: false # true | false; default: false. If True, prints progress. Inherits shared.param:debug_logs when set.
  # param:cache: null # positive GB | null; default: null. Parallelization strategy at the window level within each image. Inherits shared.param:cache when set.
  # param:image_threads: null # cpu | positive integer | null; default: null. Parallelism for per-image operations. Inherits shared.param:image_threads when set.
  # param:io_threads: null # cpu | positive integer | null; default: null. Parallelism for IO operations. Inherits shared.param:io_threads when set.
  # param:tile_threads: null # cpu | positive integer | null; default: null. "cpu" to get number of cores, int to assign number, and None to disable tile level parallelism. Inherits shared.param:tile_threads when set.
  # param:concurrent_processing_backend: "process_pool" # string; default: "process_pool". Use a local process pool or an existing Dask cluster. Inherits shared.param:concurrent_processing_backend when set.
  # param:dask_scheduler: null # [file, path] | [address, URL] | null; default: null. Existing Dask scheduler as ("file", path) or ("address", address). Inherits shared.param:dask_scheduler when set.
  # param:include_touched_pixels: false # true | false; default: false.
  # param:custom_nodata_value: null # number | null; default: null. Overrides detected NoData value. Inherits shared.param:custom_nodata_value when set.
  # param:resume_from_outputs: "no" # no | yes | validate; default: "no". Inherits shared.param:resume_from_outputs when set.


# Merge into a mosaic. For output_tiles: true, use a directory as output_image_path.
# This example writes one GeoTIFF with VHR overviews. For tiled output, choose a folder and configure tile settings explicitly.
merge_rasters:
  plugin: merge_rasters
  core:run: true # true | false; default: false. Enable this step.
  core:calculate_overviews: true # true | false; default: false. VHR builds overviews using shared.param:window_scales.
  param:input_images: collect:current_image_paths # path list | glob/folder; required. Defines input files from a glob path, folder, or list of paths.
  const:mosaic_output_dirs: collect:output_dir # Explicitly collect scene roots for this one shared product.
  const:mosaic_path: expr:const.mosaic_output_dirs[0] & '/mosaic.tif'
  param:output_image_path: const:mosaic_path # string; required. One mosaic in the first scene's output directory; output_tiles=True uses a folder.
  var:current_image_paths: const:mosaic_path # One final mosaic path per contributing scene.
  # param:output_tiles: false # true | false; default: false. Write tiles into a folder instead of one mosaic file.
  # param:cache: null # positive GB | null; default: null. GDAL cache size in GB, or None for the GDAL default. Inherits shared.param:cache when set.
  param:image_threads: null # default: null. Override shared tile scheduling for a single-file merge; remove for tile mode.
  # param:io_threads: null # cpu | positive integer | null; default: null. Parallelism for IO operations. Inherits shared.param:io_threads when set.
  # param:tile_threads: null # cpu | positive integer | null; default: null. "cpu" to get number of cores, int to assign number, and None to disable tile level parallelism. Inherits shared.param:tile_threads when set.
  # param:debug_logs: false # true | false; default: false. If True, prints progress. Inherits shared.param:debug_logs when set.
  # param:output_dtype: null # raster dtype | null; default: null. Data type for output rasters. Inherits shared.param:output_dtype when set.
  # param:custom_nodata_value: null # number | null; default: null. Overrides detected NoData value. Inherits shared.param:custom_nodata_value when set.
  # param:resolution: "highest" # highest | average | lowest; default: "highest". highest | average | lowest | positive pixel size in CRS units
  # param:window_size: null # positive integer | null; default: null. In tile mode, output tile width/height in pixels (-ps), default 256. Inherits shared.param:window_size when set.
  # param:overlap: 0 # number; default: 0. Tile mode only; smaller than window_size
  # param:build_overviews: false # true | false; default: false. Leave unset; VHR core calculates overviews.
  # param:window_scales: [2, 4, 8, 16, 32] # list; default: [2, 4, 8, 16, 32]. Overview factors, default (2, 4, 8, 16, 32). Inherits shared.param:window_scales when set.

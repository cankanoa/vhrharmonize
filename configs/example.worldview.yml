# Optional low-resolution test after alignment. Uncomment this block to resample every scene
# to 30 m and use those copies for all subsequent image steps. Inputs must use a projected CRS
# with metre units; align_rasters preserves the input CRS. The _30m suffix distinguishes test outputs.
# test_low_resolution_run:
#   plugin: align_rasters
#   core:run: true # true | false; default: false. Enable when this block is uncommented.
#   # core:require_outputs: param:output_images # Default: false. Uncomment to request this output explicitly.
#   core:scope: aggregate # scene | aggregate; default: aggregate. Process all current scene rasters.
#   param:input_images: collect:current_image_paths # path list; required. Aligned images for every scene.
#   var:suffix: expr:var.suffix & '_30m'
#   var:current_image_paths: expr:const.temp_dir & '/test_low_resolution_run/' & var.basename & var.suffix & '.tif'
#   param:output_images: collect:current_image_paths # path list; required. One temporary 30 m copy per scene.
#   param:resolution: 30 # positive CRS pixel size | highest | average | lowest | null; default: null. 30 m square pixels.
#   param:resampling_method: bilinear # nearest | bilinear | cubic; default: bilinear.
#   param:tap: true # true | false; default: false. Snap extents to the common 30 m grid.

# SpectralMatch functions run in the order shown: matching -> footprints -> Markov -> mask -> merge.
# The final merge is last so the completed mosaic also determines the final metadata snapshot.
# Alternative algorithms and optional utilities are fully commented but retain their parameter catalogs.
# Uncomment an alternative block and replace the corresponding active stage; update its explicit input links.
# Multi-raster destinations are explicit lists for core reuse, validation, cleanup and HPC transfers.
# Native folder/glob/template shorthand remains available to direct Python calls.
# Core reuses explicit files; functions manage directory contents with resume_from_outputs.
setup_spectralmatch:
  core:run: true # true | false; default: false. Prepare shared polygon settings.
  core:scope: aggregate # scene | aggregate; default: scene.
  # Automatically inherited from shared.param: when accepted: custom_nodata_value,
  # output_dtype, window_scales, concurrent_processing_backend, window_size,
  # image_threads, io_threads, tile_threads, cache, dask_scheduler, calculation_dtype,
  # save_as_cog, debug_logs and resume_from_outputs. Commented shared settings use function defaults.
  # create_footprints accepts epsg to project raster or supplied metadata footprints.
  # core: controls stay with VHR; core:calculate_overviews uses shared.param:window_scales.
  # Only state needed by later steps belongs in const:; ordinary settings remain param: values.
  const:spectralmatch.polygon_layer: footprints # Shared by footprint generation and seamline selection.
  const:spectralmatch.image_field_name: image # Shared identifier field for footprint generation, seamlines and masking; image_path is reserved by SpectralMatch.

# Allocate initial coverage from IMD corners before coregistration and matching.
# This invokes the same plugin as the later valid-data footprint step.
standardize_mosaic_coverage:
  plugin: create_footprints
  core:run: true # true | false; default: false. Reduce the area processed by SpectralMatch.
  param:input_images: collect:current_image_paths # path list; required. Ordered across imported records.
  param:metadata_records: collect:footprint_metadata # JSON object list | null; default: null. One record per input image; required for metadata geometry.
  const:coverage_mask: expr:const.temp_dir & '/standardize_mosaic_coverage/coverage.gpkg'
  param:output_polygons: const:coverage_mask # path; required. Ranked coverage polygons; images with no retained area have no output polygon.
  param:output_layer: const:spectralmatch.polygon_layer # layer name; default: footprints.
  param:image_field_name: const:spectralmatch.image_field_name # field name; default: image. Current image stems match the coverage-cropped output suffixes.
  # param:metadata_crs: "EPSG:4326" # CRS string; default: "EPSG:4326". CRS of mapped IMD geometry.
  param:footprint_source: metadata # calculate_bounds | metadata; default: calculate_bounds. Uses mapped IMD corners without reading raster pixels.
  # param:outline_path: null # path | null; default: null. Goal-area polygon file; null uses all image coverage. Example: path:/path/to/outline.gpkg.
  # param:outline_layer: null # layer name | null; default: null. First layer when null; requires outline_path.
  # Higher scores rank on top. Negate the combined raw angles so the lowest sum wins.
  # Each degree counts equally for both angles; a combined angle of zero gives the best score (zero).
  param:image_rank_function: "-({var:view_zenith} + {var:solar_zenith})" # expression | null; default: null. Explicit initial-coverage preference; native ranking remains unset by default.
  param:image_rank_descending: true # true | false; default: true. Larger expression scores own overlaps.
  param:min_polygon_area: 1.0 # square metres; default: 1.0. Remove tiny owned pieces before buffering; null disables.
  param:extrude_distance: 500 # nonnegative number; default: 0.0. Overlap/movement margin in projected CRS units, clipped to each source footprint; also extends beyond the outline.
  # Coverage options recompute ownership together even when resume_from_outputs requests reuse.

# Crop once; all following steps consume these smaller rasters and retain their masks.
mask_mosaic_coverage:
  plugin: mask_rasters
  core:run: true # true | false; default: false. Apply initial coverage before joint coregistration.
  param:input_images: collect:current_image_paths # path list; required. Only scenes retained by standardize_mosaic_coverage.
  var:suffix: expr:var.suffix & '_coverage'
  var:current_image_paths: expr:const.temp_dir & '/mask_mosaic_coverage/' & var.basename & var.suffix & '.tif'
  param:output_images: collect:current_image_paths # path list; required. Cropped rasters used by subsequent processing.
  core:requires: const:coverage_mask
  param:vector_mask: [include, const:coverage_mask, const:spectralmatch.image_field_name] # [include|exclude, path, optional_field] | null; default: null.

# Jointly register overlapping imagery before matching.
joint_coregistration:
  plugin: joint_coregistration
  core:run: true # true | false; default: false. Enable this step.
  # core:require_outputs: param:output_images # Default: false. Uncomment to request this output explicitly.
  param:input_images: collect:current_image_paths # path list; required. Previous enabled image step.
  var:suffix: _coreg
  var:current_image_paths: expr:const.temp_dir & '/joint_coregistration/' & var.basename & var.suffix & '.tif'
  param:output_images: collect:current_image_paths # path list | template/folder; required. Folder (writes '$_Coregistered.tif'), '$' basename template, or list[str] matching input order and length; output paths must be unique and differ from inputs.
  # param:moving_tie_method: "orb" # orb | elastix; default: orb. Matcher between moving images.
  # param:fixed_tie_method: "elastix" # orb | elastix; default: elastix. Matcher against fixed_images; unused without references.
  # Disable lidar_joint_coregistration above when using this combined LiDAR + image-to-image solve.
  # param:fixed_images: expr:[const.reference_path] # Uncomment to anchor this joint solve to LiDAR; reference stays read-only.
  # param:input_images_bands: [1] # One-based matching bands; multiple bands are averaged into grayscale.
  # param:fixed_images_bands: [1] # One-based reference matching bands; multiple bands are averaged into grayscale.
  # param:tie_grid_spacing: 500.0 # number; default: 500.0. Positive CRS-unit distance between search-window centers in each pair's overlap; default 500.0; independent of local_model and local_grid_spacing.
  # param:tie_search_radius: "128px" # string; default: "128px". Window half-width; positive number followed by px or crs
  # param:tie_orb_max_features: 100 # number; default: 100. Per image per search window
  # param:tie_max_matches_per_window: 1 # number; default: 1. Per image pair; null keeps all surviving matches
  # param:tie_maximum_displacement: null # number | null; default: null. Maximum displacement in CRS units; null disables the limit
  # param:tie_ransac_reprojection_threshold: null # number | null; default: null. CRS units; null uses three pixels at the coarser resolution
  # param:tie_robust_loss: "huber" # none | huber | soft_l1 | cauchy; default: "huber".
  # param:tie_robust_loss_scale: null # number | null; default: null. CRS units; null uses the median pair RANSAC threshold
  # param:tie_save_path: null # string | null; default: null. Selected ties in original zero-based pixel coordinates Example: /path/to/tie_points.json.
  # param:tie_save_crs_path: null # string | null; default: null. Paired points in the input CRS; GPKG or GeoJSON Example: /path/to/tie_points.gpkg.
  # param:tie_load_path: null # path | null; default: null. Saved tie pairs; use an existing file for workflow/HPC input checks.
  # param:global_model: "translation" # none | translation | similarity | affine; default: "translation".
  # param:global_image_movement_penalty_weights: null # object | null; default: null. Ordered basename-glob mapping to positive weights; first match wins; larger weights resist movement
  # param:global_tie_alignment_strength: 1.0 # number; default: 1.0. Number in [0, 1] for all images or JSON object string such as '{"base": 0, "*": 1}'; first wcmatch.glob basename match wins; unmatched names use 1; scales each image's solved global correction.
  # param:local_model: "piecewise_affine" # none | bilinear | piecewise_affine; default: "piecewise_affine".
  # param:local_image_movement_penalty_weights: null # object | null; default: null. Ordered basename-glob mapping to positive weights; first match wins; larger weights resist deformation
  # param:local_tie_alignment_strength: 1.0 # number; default: 1.0. Number in [0, 1] for all images or JSON object string such as '{"base": 0, "*": 1}'; first wcmatch.glob basename match wins; unmatched names use 1; scales each image's solved local displacement.
  # param:local_grid_spacing: 500.0 # number; default: 500.0. Positive target local deformation mesh spacing in CRS units; default 500.0; independent of tie-point search spacing.
  # param:local_smoothness_weight: 1.0 # number; default: 1.0. Non-negative number penalizing differences between neighboring node displacements; default 1.0.
  # param:local_bending_weight: 1.0 # number; default: 1.0. Non-negative number penalizing displacement curvature; default 1.0.
  # param:local_anchor_falloff_distance: 500.0 # number; default: 500.0. Positive CRS-unit distance controlling tie-point influence on mesh anchoring; default 500.0.
  # param:resampling_method: "bilinear" # nearest | bilinear | cubic | lanczos; default: "bilinear".
  # param:tap: false # true | false; default: false.
  # param:resolution: null # highest | average | lowest | positive CRS pixel size | null; default: null. Preserve native resolution; or highest | average | lowest | positive pixel size in CRS units
  # param:output_dtype: null # raster dtype | null; default: null. GDAL dtype name such as 'uint16' or 'float32'; None preserves each input dtype. Inherits shared.param:output_dtype when set.
  # param:custom_nodata_value: null # number | null; default: null. Numeric output NoData value; None preserves the detected input value. Inherits shared.param:custom_nodata_value when set.
  # param:window_size: null # positive integer | null; default: null. Positive int output tile size in pixels or None for native block size; COG output requires a multiple of 16. Inherits shared.param:window_size when set.
  # param:save_as_cog: false # true | false; default: false. bool, default False; write Cloud-Optimized GeoTIFF outputs. Inherits shared.param:save_as_cog when set.
  # param:build_overviews: false # true | false; default: false. Leave unset; VHR core calculates overviews.
  # param:window_scales: [2, 4, 8, 16, 32] # list; default: [2, 4, 8, 16, 32]. tuple[int, ...] of overview factors, default (2, 4, 8, 16, 32); None or () disables overview creation. Inherits shared.param:window_scales when set.
  # param:cache: null # positive GB | null; default: null. Positive number of gigabytes for the GDAL cache; None retains its current setting. Inherits shared.param:cache when set.
  # param:io_threads: null # cpu | positive integer | null; default: null. Positive int GDAL I/O worker count, 'cpu' for all cores, or None for its default. Inherits shared.param:io_threads when set.
  # param:debug_logs: false # true | false; default: false. bool, default False; print processing details. Inherits shared.param:debug_logs when set.
  # param:resume_from_outputs: "no" # no | yes | validate; default: "no". 'no' (default) overwrites, 'yes' reuses existing outputs, or 'validate' reuses outputs that pass validation. Inherits shared.param:resume_from_outputs when set.

# Build actual valid-data footprints after initial masking/coregistration for final seamlines.
create_footprints:
  plugin: create_footprints
  core:run: true # true | false; default: false. Calculate actual footprints for final seamlines.
  # core:require_outputs: param:output_polygons # Default: false. Uncomment to retain the polygon file.
  param:input_images: collect:current_image_paths # path list; required. Current rasters in scene order.
  param:metadata_records: collect:footprint_metadata # JSON object list | null; default: null. Flat attributes and optional GeoJSON geometry in image order; mutually exclusive with metadata_csv.
  const:footprints: expr:const.temp_dir & '/create_footprints/footprints.gpkg'
  param:output_polygons: const:footprints # path; required. Input to the final seamline solver.
  param:output_layer: const:spectralmatch.polygon_layer # layer name; default: "footprints".
  param:image_field_name: const:spectralmatch.image_field_name # field name; default: "image". Current raster stem; later suffixes retain this identifier.
  # param:metadata_csv: null # path | null; default: null. Alternative CSV attributes; omit metadata_records when using this.
  # param:metadata_image_field_name: "image" # field name; default: "image". CSV join field.
  # param:footprint_source: "calculate_bounds" # calculate_bounds | metadata; default: "calculate_bounds". Raster validity masks; metadata uses supplied geometry without raster reads.
  # param:metadata_crs: "EPSG:4326" # CRS string; default: "EPSG:4326". CRS of metadata geometry.
  # param:epsg: null # EPSG integer | null; default: null. Inherits shared.param:epsg; null preserves the source CRS.
  # param:band: 1 # positive integer; default: 1. Raster band whose GDAL validity mask is polygonized.
  # param:eight_connected: true # true | false; default: true. Preserve diagonally connected valid pixels.
  # param:outline_path: null # path | null; default: null. Optional goal-area polygon; omitted here to retain raw valid-data footprints.
  # param:outline_layer: null # layer name | null; default: null. First layer when null.
  # param:image_rank_function: null # expression | null; default: null. Preserve overlapping footprints for the final seamline solver.
  # param:image_rank_descending: true # true | false; default: true. Larger scores own overlaps when ranking is enabled.
  # param:extrude_distance: 0.0 # nonnegative number; default: 0.0. Buffer owned coverage in projected output CRS units, clipped to source footprints.
  # param:debug_logs: false # true | false; default: false. Inherits shared.param:debug_logs when set.
  # param:resume_from_outputs: "no" # no | yes | validate; default: "no". Native raw-footprint reuse; coverage options always recompute.

# Global radiometric regression between overlapping images.
global_regression:
  plugin: global_regression
  core:run: true # true | false; default: false. Enable this step.
  # core:require_outputs: param:output_images # Default: false. Uncomment to request this output explicitly.
  # core:calculate_overviews: true # true | false; default: false. VHR builds overviews using shared.param:window_scales.
  param:input_images: collect:current_image_paths # path list; required. Previous enabled image step.
  var:suffix: expr:var.suffix & '_global'
  var:current_image_paths: expr:const.temp_dir & '/global_regression/' & var.basename & var.suffix & '.tif'
  param:output_images: collect:current_image_paths # path list | template/folder; required. Defines output files from a template path, folder, or list of paths (with the same length as the input).
  # param:calculation_dtype: "float32" # raster dtype; default: "float32". Precision for internal calculations. Inherits shared.param:calculation_dtype when set.
  # param:output_dtype: null # raster dtype | null; default: null. Data type for output rasters. Inherits shared.param:output_dtype when set.
  # param:vector_mask: null # [include|exclude, path, optional_field] | null; default: null. Example: [include, /path/to/global_mask.gpkg, image].
  # param:debug_logs: false # true | false; default: false. If True, prints debug info and progress. Inherits shared.param:debug_logs when set.
  # param:custom_nodata_value: null # number | null; default: null. Overrides detected NoData value. Inherits shared.param:custom_nodata_value when set.
  # param:cache: null # positive GB | null; default: null. Controls GDAL cache size in GB. Inherits shared.param:cache when set.
  # param:io_threads: null # cpu | positive integer | null; default: null. Parallelism for IO operations. Inherits shared.param:io_threads when set.
  # param:window_size: null # positive integer | null; default: null. Output image tile size. Inherits shared.param:window_size when set.
  # param:save_as_cog: false # true | false; default: false. If True, saves output as a Cloud-Optimized GeoTIFF using proper band and block order. Inherits shared.param:save_as_cog when set.
  # param:estimate_stats: true # true | false; default: true.
  # param:specify_model_images: null # string | null; default: null. Example: [include, [image_a, image_b]].
  # param:custom_mean_factor: 1.0 # number; default: 1.0. Weight for mean constraints in regression.
  # param:custom_std_factor: 1.0 # number; default: 1.0. Weight for standard deviation constraints in regression.
  # param:save_adjustments: null # string | null; default: null. Example: /path/to/adjustments.json.
  # param:load_adjustments: null # path | null; default: null. Saved adjustments; use an existing file for workflow/HPC input checks.
  # param:pif_method: "flood_from_match_points" # entire | flood_from_match_points; default: "flood_from_match_points". flood_from_match_points | entire
  # param:pif_red_band_index: null # number | null; default: null. Optional red band index for vegetation filtering
  # param:pif_nir_band_index: null # number | null; default: null. Optional NIR band index for vegetation filtering
  # param:pif_vegetation_threshold: 0.2 # number; default: 0.2. Vegetation threshold used with NDVI filtering.
  # param:pif_inz_threshold: 0.25 # number; default: 0.25. Integrated normalized Z-score threshold used for flood_from_match_points.
  # param:pif_region_radius: 5 # number; default: 5.
  # param:pif_max_samples: 10000 # number; default: 10000. null disables the cap
  # param:pif_min_samples: 10 # number; default: 10. Minimum number of PIF samples, default 10.
  # param:pif_feature_method: "orb" # orb; default: "orb".
  # param:pif_load_ties: null # path | null; default: null. Saved PIF seed ties; use an existing file for workflow/HPC input checks.
  # param:pif_save_inz: null # string | null; default: null. Example: /path/to/inz_outputs.
  # param:build_overviews: false # true | false; default: false. Leave unset; VHR core calculates overviews.
  # param:window_scales: [2, 4, 8, 16, 32] # list; default: [2, 4, 8, 16, 32]. Overview decimation factors, default (2, 4, 8, 16, 32); None or an empty tuple disables overview creation. Inherits shared.param:window_scales when set.
  # param:resume_from_outputs: "no" # no | yes | validate; default: "no". Inherits shared.param:resume_from_outputs when set.
  # Compound file arguments need an explicit dependency:
  # const:regression_mask: /path/to/global_mask.gpkg
  # core:requires: const:regression_mask
  # param:vector_mask: [include, const:regression_mask, image]
  # pif_save_inz is a backend-managed filename/template; pair names are generated by SpectralMatch.

# Local radiometric adjustment; block counts and method control spatial correction.
local_block_adjustment:
  plugin: local_block_adjustment
  core:run: true # true | false; default: false. Enable this step.
  # core:require_outputs: param:output_images # Default: false. Uncomment to request this output explicitly.
  # core:calculate_overviews: true # true | false; default: false. VHR builds overviews using shared.param:window_scales.
  param:input_images: collect:current_image_paths # path list; required. Previous enabled image step.
  var:suffix: expr:var.suffix & '_local'
  var:current_image_paths: expr:const.temp_dir & '/local_block_adjustment/' & var.basename & var.suffix & '.tif'
  param:output_images: collect:current_image_paths # path list | template/folder; required. Defines output files from a template path, folder, or list of paths (with the same length as the input).
  # param:calculation_dtype: "float32" # raster dtype; default: "float32". Precision for internal calculations. Inherits shared.param:calculation_dtype when set.
  # param:output_dtype: null # raster dtype | null; default: null. Data type for output rasters. Inherits shared.param:output_dtype when set.
  # param:vector_mask: null # [include|exclude, path, optional_field] | null; default: null. Example: [include, /path/to/local_mask.gpkg, image].
  # param:debug_logs: false # true | false; default: false. If True, prints debug info and progress. Inherits shared.param:debug_logs when set.
  # param:custom_nodata_value: null # number | null; default: null. Overrides detected NoData value. Inherits shared.param:custom_nodata_value when set.
  # param:cache: null # positive GB | null; default: null. Controls GDAL cache size in GB. Inherits shared.param:cache when set.
  # param:io_threads: null # cpu | positive integer | null; default: null. Parallelism for IO operations. Inherits shared.param:io_threads when set.
  # param:window_size: null # positive integer | null; default: null. Output image tile size. Inherits shared.param:window_size when set.
  # param:save_as_cog: false # true | false; default: false. If True, saves output as a Cloud-Optimized GeoTIFF using proper band and block order. Inherits shared.param:save_as_cog when set.
  # param:number_of_blocks: 100 # positive integer | [rows, columns] | coefficient_of_variation; default: 100. Integer, [rows, columns], or coefficient_of_variation
  # param:alpha: 1.0 # number; default: 1.0. Blending factor between reference and local means.
  # param:correction_method: "offset" # gamma | linear | offset; default: "offset".
  # param:save_block_maps: null # list | null; default: null. Example: [/path/to/reference_block_map.tif, /path/to/local_block_maps/{}.tif].
  # param:load_block_maps: null # list | null; default: null. Either entry may be null Example: [/path/to/reference_block_map.tif, [/path/to/local_block_map.tif]].
  # param:override_bounds_canvas_coords: null # list | null; default: null. Example: [0, 0, 1000, 1000].
  # param:build_overviews: false # true | false; default: false. Leave unset; VHR core calculates overviews.
  # param:window_scales: [2, 4, 8, 16, 32] # list; default: [2, 4, 8, 16, 32]. Overview decimation factors, default (2, 4, 8, 16, 32); None or an empty tuple disables overview creation. Inherits shared.param:window_scales when set.
  # param:resume_from_outputs: "no" # no | yes | validate; default: "no". Inherits shared.param:resume_from_outputs when set.
  # save_block_maps uses [reference_tif, local_tif_template]; $ is expanded by SpectralMatch.
  # load_block_maps uses [reference_tif_or_null, [local_tifs]_or_null].
  # Add existing load files to core:requires for HPC; diagnostic output templates are backend-managed.

# Optional footprint cleanup. Distances require a suitable projected CRS and image-specific tuning.
postprocess_footprints:
  plugin: postprocess_footprints
  core:run: true # true | false; default: false. Enable this step.
  # core:require_outputs: param:output_polygons # Default: false. Uncomment to request this output explicitly.
  param:input_polygons: const:footprints # path; required. Current footprints.
  param:input_layer: const:spectralmatch.polygon_layer # string; default: footprints. Layer in current footprints.
  const:footprints: expr:const.temp_dir & '/postprocess_footprints/postprocess_footprints.gpkg'
  const:spectralmatch.polygon_layer: footprints
  param:output_polygons: const:footprints # string; required. Output GeoPackage path for processed polygons and their original attributes; must differ from input_polygons.
  param:output_layer: const:spectralmatch.polygon_layer # string; default: "footprints". Output GeoPackage layer for processed footprints, default "footprints".
  # param:hole_edge_distance: 800 # number; default: 800. Maximum hole-to-edge distance in projected CRS units; 0 disables edge cuts
  # param:hole_to_hole_distance: 800 # number; default: 800. Maximum distance between original holes in one component; 0 disables hole-pair cuts
  # param:hole_relative_edge_distance: null # number | null; default: null. Optional edge distance limit relative to sqrt(hole_area / pi)
  # param:hole_cut_width: "maximum_inscribed_circle" # hole_size | maximum_inscribed_circle; default: "maximum_inscribed_circle". Positive integer | hole_size | maximum_inscribed_circle; pairs use the smaller width
  # param:hole_cut_method: "corridor" # corridor | buffer; default: "corridor".
  # param:simplify_smoothing_radius: 240 # number; default: 240. Inward smoothing radius in projected CRS units; 0 disables smoothing
  # param:simplify_tolerance: 120 # number; default: 120. Maximum inward simplification deviation in projected CRS units; 0 disables simplification
  # param:simplify_area_weight: 0.5 # number; default: 0.5. Weight in [0, 1] balancing normalized area loss against perimeter reduction in the greedy inward shortcut simplifier; larger values favor retaining area.
  # param:filter_area_size: null # number | null; default: null. Minimum component area in squared CRS units
  # param:filter_area_rank: 1 # number; default: 1. Largest N components; negative N keeps smallest abs(N); 0 or null keeps all
  # param:debug_logs: false # true | false; default: false. Enables debug print statements if True; default is False. Inherits shared.param:debug_logs when set.
  # param:resume_from_outputs: "no" # no | yes | validate; default: "no". Recompute outputs with "no", reuse existing outputs with "yes", or validate existing outputs before reusing them with "validate"; incomplete streaming outputs are recomputed. Inherits shared.param:resume_from_outputs when set.

# # Voronoi seamlines. Enable one seamline algorithm for masking.
# voronoi_center_seamline:
#   plugin: voronoi_center_seamline
#   core:run: true # true | false; default: false. Enable this step.
#   # core:require_outputs: param:output_mask # Default: false. Uncomment to request this output explicitly.
#   const:spectralmatch.mask: expr:const.temp_dir & '/voronoi_center_seamline/voronoi_center_seamline.gpkg'
#   param:input_polygons: const:footprints # path; required. Polygons from the selected footprint step.
#   param:output_mask: const:spectralmatch.mask # string; required. Output path for the final seamline polygon vector file.
#   param:input_images: collect:current_image_paths # list | null; default: null. Optional raster folder, glob or paths for substring footprint matching; None infers names from the polygon field.
#   # param:aoi_path: null # string | null; default: null. Example: /path/to/aoi.gpkg.
#   param:input_layer: const:spectralmatch.polygon_layer # string; default: "footprints". Inherits preceding footprint layer when using its polygons
#   # param:output_layer: "seamlines" # string; default: "seamlines". Output GeoPackage layer name for Voronoi seamlines; default "seamlines".
#   param:image_field_name: const:spectralmatch.image_field_name # string; default: "image". Explicit setup value.
#   # param:min_point_spacing: 10 # number; default: 10.
#   # param:min_cut_length: 0 # number; default: 0.
#   # param:debug_logs: false # true | false; default: false. Enables debug print statements if True; default is False. Inherits shared.param:debug_logs when set.
#   # param:debug_vectors_path: null # string | null; default: null. Example: /path/to/debug_vectors.gpkg.
#   # param:resume_from_outputs: "no" # no | yes | validate; default: "no". Recompute outputs with "no", reuse existing outputs with "yes", or validate existing outputs before reusing them with "validate"; default is "no". Inherits shared.param:resume_from_outputs when set.

# # Weighted seamlines. Ranking requires attributes in the input polygons.
# # Rank expressions use {var:field} and {summary:field} placeholders, arithmetic,
# # comparisons, and/or/not, parentheses and abs/min/max/round/sqrt/log/log10/exp/sin/cos/tan.
# # Summaries: mean/std/variance/min/max/median/sum/count/range; std and variance use the population.
# weighted_seamline:
#   plugin: weighted_seamline
#   core:run: true # true | false; default: false. Enable this step.
#   # core:require_outputs: param:output_mask # Default: false. Uncomment to request this output explicitly.
#   const:spectralmatch.mask: expr:const.temp_dir & '/weighted_seamline/weighted_seamline.gpkg'
#   param:input_polygons: const:footprints # path; required. Footprints and attributes from the selected footprint step.
#   param:output_mask: const:spectralmatch.mask # string; required. Output GeoPackage path for the ranked seamline polygons.
#   param:input_images: collect:current_image_paths # list | null; default: null. Optional raster folder, glob or paths for substring footprint matching; None infers names from the polygon field.
#   param:rank_function: "-({var:view_zenith} + {var:solar_zenith})" # string; required. Higher scores rank on top; the lowest combined raw angle wins.
#   param:image_field_name: const:spectralmatch.image_field_name # string; default: "image". Explicit setup value.
#   param:input_layer: const:spectralmatch.polygon_layer # string; default: "footprints". Defaults to "footprints" for explicit polygons; None selects their first layer; either inherits the preceding footprint step's layer when using its polygons.
#   # param:output_layer: "seamlines" # string; default: "seamlines".
#   # param:rank_descending: true # true | false; default: true.
#   # param:debug_logs: false # true | false; default: false. If True, prints ranking details. Inherits shared.param:debug_logs when set.
#   # param:resume_from_outputs: "no" # no | yes | validate; default: "no". Recompute outputs with "no", reuse existing outputs with "yes", or validate existing outputs before reusing them with "validate"; default is "no". Inherits shared.param:resume_from_outputs when set.

# Markov mesh seamlines. Raster costs and image quality determine the selected polygons.
markov_triangles:
  plugin: markov_triangles
  core:run: true # true | false; default: false. Enable this step.
  # core:require_outputs: param:output_mask # Default: false. Uncomment to request this output explicitly.
  const:spectralmatch.mask: expr:const.temp_dir & '/markov_triangles/markov_triangles.gpkg'
  param:input_images: collect:current_image_paths # path list | glob/folder; required. Raster folder, glob or path list; basenames without extensions must be unique.
  param:output_mask: const:spectralmatch.mask # string; required. Output GeoPackage path, distinct from input vectors; stores image identifiers, image_path and raw quality_score.
  param:input_polygons: const:footprints # string | null; default: null. Optional valid-data footprints; None polygonizes band-1 GDAL masks, while supplied polygons must match every image and are never regenerated.
  param:input_layer: const:spectralmatch.polygon_layer # string; default: "footprints". Input footprint layer name; None selects the first layer.
  # param:output_layer: "seamlines" # string; default: "seamlines". Output polygon layer name; defaults to "seamlines".
  param:image_field_name: const:spectralmatch.image_field_name # string; default: "image". Footprint field containing each input basename without extension as a substring; matching pieces are dissolved using first-match attributes; defaults to "image". Explicit setup value.
  # param:image_rank_function: null # string | null; default: null. Optional footprint-attribute expression using weighted() syntax, e.g.
  # param:image_rank_descending: true # true | false; default: true. True favors larger quality scores, False favors smaller scores; defaults to True.
  # param:image_quality_weight: 1.0 # number; default: 1.0. Nonnegative multiplier of assigned area times globally min-max-normalized quality penalty; zero removes quality preference; defaults to 1.
  # param:edge_variables_weights_gsds_bands: [["laplacian_difference", 1.0, ["native"], [1]], ["laplacian_magnitude", 0.25, [100], [1]]] # list; default: [["laplacian_difference", 1.0, ["native"], [1]], ["laplacian_magnitude", 0.25, [100], [1]]]. Terms [name_or_path, nonnegative weight, GSD selection, band selection]; use [value] for one value or {"average" | "largest" | "smallest": [values]} for two or more; GSDs are positive integers in CRS units or "
  # param:foreground_path: null # string | null; default: null. Optional polygon mask forbidding seams through protected interiors; infeasible coverage raises ValueError.
  # param:foreground_layer: null # string | null; default: null. Optional layer in foreground_path; None reads the default layer.
  param:mesh_spacing: 500 # number; default: 10. Positive mesh-cell width in CRS units, independent of cost GSDs; footprint boundaries constrain triangles; defaults to 10.
  # param:quadtree_max_images_per_leaf: 16 # number; default: 16. Positive label-count target for quadtree leaves; defaults to 16.
  # param:quadtree_overlap: 0.1 # number; default: 0.1. Child-block overlap fraction in (0, 0.5); defaults to 0.1.
  # param:quadtree_max_depth: 8 # number; default: 8. Nonnegative quadtree subdivision limit; defaults to 8.
  # param:solver_max_iterations: 50 # number; default: 50. Positive graph-cut sweep limit per node; defaults to 50; reaching the limit warns.
  # param:debug_logs: false # true | false; default: false. Print node sizes and processing details; defaults to False. Inherits shared.param:debug_logs when set.
  # param:resume_from_outputs: "no" # no | yes | validate; default: "no". "no" recomputes, "yes" reuses existing output, "validate" checks the requested polygon layer; incomplete outputs always recompute. Inherits shared.param:resume_from_outputs when set.
  # External raster costs in edge_variables_weights_gsds_bands also need explicit core:requires paths.

# Clip rasters using the selected seamlines. The explicit requires link tracks the compound vector_mask file.
mask_rasters:
  plugin: mask_rasters
  core:run: true # true | false; default: false. Enable this step.
  # core:require_outputs: param:output_images # Default: false. Uncomment to request this output explicitly.
  # core:calculate_overviews: true # true | false; default: false. VHR builds overviews using shared.param:window_scales.
  param:input_images: collect:current_image_paths # path list; required. Previous enabled image step.
  var:suffix: expr:var.suffix & '_masked'
  var:current_image_paths: expr:const.temp_dir & '/mask_rasters/' & var.basename & var.suffix & '.tif'
  core:requires: const:spectralmatch.mask
  param:output_images: collect:current_image_paths # path list | template/folder; required. Defines output files from a template path, folder, or list of paths (with the same length as the input).
  param:vector_mask: [include, const:spectralmatch.mask, const:spectralmatch.image_field_name] # [include|exclude, path, optional_field] | null; default: null. Example: [include, /path/to/seamline_mask.gpkg, image].
  # param:window_size: null # positive integer | null; default: null. Tile size for processing tiles. Inherits shared.param:window_size when set.
  # param:debug_logs: false # true | false; default: false. If True, prints progress. Inherits shared.param:debug_logs when set.
  # param:cache: null # positive GB | null; default: null. Parallelization strategy at the window level within each image. Inherits shared.param:cache when set.
  # param:io_threads: null # cpu | positive integer | null; default: null. Parallelism for IO operations. Inherits shared.param:io_threads when set.
  # param:include_touched_pixels: false # true | false; default: false.
  # param:custom_nodata_value: null # number | null; default: null. Overrides detected NoData value. Inherits shared.param:custom_nodata_value when set.
  # param:resume_from_outputs: "no" # no | yes | validate; default: "no". Inherits shared.param:resume_from_outputs when set.


# Merge into a mosaic. For output_tiles: true, use a directory as output_image_path.
# This example writes one GeoTIFF with VHR overviews. For tiled output, choose a folder and configure tile settings explicitly.
merge_rasters:
  plugin: merge_rasters
  core:run: true # true | false; default: false. Enable this step.
  # core:require_outputs: param:output_image_path # Requested deliverables; upstream steps run as needed.
  # core:calculate_overviews: true # true | false; default: false. VHR builds overviews using shared.param:window_scales.
  param:input_images: collect:current_image_paths # path list | glob/folder; required. Defines input files from a glob path, folder, or list of paths.
  const:mosaic_path: expr:const.output_dir & '/mosaic.tif'
  param:output_image_path: const:mosaic_path # string; required. One mosaic in the shared output directory; output_tiles=True uses a folder.
  var:current_image_paths: const:mosaic_path # One final mosaic path per contributing scene.
  # param:output_tiles: false # true | false; default: false. Write tiles into a folder instead of one mosaic file.
  # param:cache: null # positive GB | null; default: null. GDAL cache size in GB, or None for the GDAL default. Inherits shared.param:cache when set.
  # param:io_threads: null # cpu | positive integer | null; default: null. Parallelism for IO operations. Inherits shared.param:io_threads when set.
  # param:debug_logs: false # true | false; default: false. If True, prints progress. Inherits shared.param:debug_logs when set.
  # param:output_dtype: null # raster dtype | null; default: null. Data type for output rasters. Inherits shared.param:output_dtype when set.
  # param:custom_nodata_value: null # number | null; default: null. Overrides detected NoData value. Inherits shared.param:custom_nodata_value when set.
  # param:resolution: "highest" # highest | average | lowest; default: "highest". highest | average | lowest | positive pixel size in CRS units
  # param:window_size: null # positive integer | null; default: null. In tile mode, output tile width/height in pixels (-ps), default 256. Inherits shared.param:window_size when set.
  # param:overlap: 0 # number; default: 0. Tile mode only; smaller than window_size
  # param:build_overviews: false # true | false; default: false. Leave unset; VHR core calculates overviews.
  # param:window_scales: [2, 4, 8, 16, 32] # list; default: [2, 4, 8, 16, 32]. Overview factors, default (2, 4, 8, 16, 32). Inherits shared.param:window_scales when set.
  # param:resampling_method: "nearest" # nearest | near | bilinear | cubic | cubicspline | lanczos; default: "nearest".
  # param:custom_tiles_csv: null # string | null; default: null. Tile mode only; filename inside each output level Example: tiles.csv.
  # param:create_vrts: "MergedImage.vrt" # string; default: "MergedImage.vrt". Filename of the full-resolution VRT in the output folder, default "MergedImage.vrt".
  # param:resume_from_outputs: "no" # no | yes | validate; default: "no". "no" overwrites outputs (omits -resume); "yes" skips existing files (-resume); "validate" checks existing tiles with the raster validation helper, removes invalid tiles, then uses -resume. Inherits shared.param:resume_from_outputs when set.

  #   WATER_VAPOR_PRESET: 1.0 # float; default: 0.0.
  #   USE_AEROSOL: "Disabled" # Disabled | Automatic Selection | Vegetation Based Retrieval | Water Based Retrieval | Wavelength Dependent Water Based Retrieval | Linear Regression Retrieval; default: use_aerosol (Python: AUTO; ENVI: Automatic Selection).
  #   AEROSOL_SCALE_HT: 2.0 # float; default: 2.0.
  #   AER_BAND_RATIO: 0.5 # float; default: 0.5.
  #   AER_BAND_WAVL: 660 # float; default: ENVI task/metadata-derived value.
  #   AER_REFERENCE_VALUE: 0.1 # float; default: 0.0.
  #   AER_REFERENCE_PIXEL: [0, 0] # int; default: ENVI task/metadata-derived value.
  #   AER_BANDLOW_WAVL: 425 # float; default: 425.
  #   AER_BANDLOW_MAXREFL: 0.2 # float; default: ENVI task/metadata-derived value.
  #   AER_BANDHIGH_WAVL: 660 # float; default: 660.
  #   AER_BANDHIGH_MAXREFL: 0.2 # float; default: 0.2.
  #   CLOUD_RASTER_URI: /path/to/cloud_mask.tif # enviuri; default: ENVI task/metadata-derived value.
  #   WATER_RASTER_URI: /path/to/water_mask.tif # enviuri; default: ENVI task/metadata-derived value.
  #   OUTPUT_RASTER_URI: /path/to/output.dat # enviuri; default: ENVI task/metadata-derived value.

# Orthorectify multispectral imagery with the source RPC model and a DEM.
orthorectify_mul:
  plugin: orthorectification
  core:run: true # true | false; default: false. Enable this step.
  param:input_image_path: var:current_image_paths # path; required.
  param:dem_image_path: const:dem_path # path; required. Or var:dem from fetch_dem.
  # param:gcp_geojson_file_path: /path/to/rpc_refinement_gcps.geojson # path | null; default: null. Refine RPCs with Orthority-format GCPs.
  # GCP format: https://orthority.readthedocs.io/en/stable/file_formats/oty_gcps.html
  var:suffix: expr:var.suffix & '_ortho'
  var:current_image_paths: expr:const.temp_dir & '/orthorectification/' & var.basename & var.suffix & '.tif'
  param:output_image_path: var:current_image_paths # path; required.
  param:output_resolution: var:product_resolution # positive number | [x,y] | null; default: null/native. CRS units; use null for a geographic CRS.
  # param:output_epsg: 6635 # EPSG integer; default: shared.epsg; required without shared.epsg.
  # param:custom_nodata_value: -9999 # number | null; default: shared.custom_nodata_value (Python: null).
  # param:output_dtype: int16 # raster dtype | null; default: shared.output_dtype (Python: source dtype).
  # param:log_to_console: false # true | false; default: false. Processing-function logs; core logging is separate.
  # param:scene_basename: var:basename # string | null; default: null. Explicit scene label for logs.
  # core:calculate_overviews: false # true | false; default: false.

# The same plugin runs again under a different, unique step name.

orthorectify_pan:
  plugin: orthorectification
  core:run: true # true | false; default: false. Enable this step.
  core:requires: var:pan_companions # path list; default: []. External PAN RPC sidecars.
  param:input_image_path: var:pan # path; required.
  param:dem_image_path: const:dem_path # path; required. Or var:dem from fetch_dem.
  var:pan: expr:const.temp_dir & '/orthorectification/' & var.basename & '_pan_ortho.tif'
  param:output_image_path: var:pan # path; required.
  # All orthorectification options listed above also apply here.

# Pansharpen corrected multispectral data with orthorectified PAN data.
pansharpen:
  plugin: pansharpen
  core:run: true # true | false; default: false. Enable this step.
  param:input_low_resolution_path: var:current_image_paths # path; required.
  param:input_high_resolution_path: var:pan # path; required.
  var:suffix: expr:var.suffix & '_pansharpen'
  var:current_image_paths: expr:const.temp_dir & '/pansharpen/' & var.basename & var.suffix & '.tif'
  param:output_image_path: var:current_image_paths # path; required.
  # param:custom_nodata_value: -9999 # number | null; default: shared.custom_nodata_value (Python: null).
  # param:log_to_console: false # true | false; default: false. Processing-function logs; core logging is separate.
  # param:scene_basename: var:basename # string | null; default: null. Explicit scene label for logs.
  # core:calculate_overviews: false # true | false; default: false.

# OmniCloudMask inference and application. Band indices here are one-based.
cloud_mask:
  plugin: cloud_mask
  core:run: true # true | false; default: false. Enable this step.
  param:input_image_path: var:current_image_paths # path; required.
  var:cloudmask: expr:var.output_dir & '/' & var.basename & var.suffix & '_cloudmask.tif'
  var:suffix: expr:var.suffix & '_cloudmasked'
  var:current_image_paths: expr:var.output_dir & '/' & var.basename & var.suffix & '.tif'
  param:output_raster_path: var:current_image_paths # path; required. Or a path under const.temp_dir when only an intermediate.
  param:output_mask_path: var:cloudmask # path; required. Binary mask; may use const:temp_dir if not a deliverable.
  param:red_band_index: const:red_band_index # one-based integer; required. WorldView red.
  param:green_band_index: const:green_band_index # one-based integer; required. WorldView green.
  param:nir_band_index: const:nir_band_index # one-based integer; required. WorldView NIR1.
  # param:cloud_classes: [1, 2, 3] # integer list; default: [1,2,3]. Classes treated as clouds/shadows.
  param:buffer_pixels: 10 # integer >= 0; default: 0. Buffer cloud mask outward; the previous example used 10.
  # param:inference_resolution_m: 10.0 # positive meters | null; default: 10.0. null keeps input grid for inference.
  # param:cloud_mask_value: 1 # integer; default: 1. Binary value to mask when applying the cloud mask.
  # param:custom_nodata_value: -9999 # number | null; default: shared.custom_nodata_value (Python: source nodata).
  # param:allow_mask_reprojection: true # true | false; default: true. Reproject a mask to the image grid if needed.
  # param:omnicloud_kwargs: # object | null; default: null. Forward additional predict_from_array options.
  #   inference_device: null # cpu | cuda | mps | null; default: null -> automatic device selection. Example: cuda.
  #   mosaic_device: cpu # cpu | cuda | mps | null; default: cpu in this plugin (upstream: inference device).
  #   batch_size: 1 # positive integer; default: 1.
  #   patch_size: 1000 # positive integer; default: 1000. Previous tuning example: 768.
  #   patch_overlap: 300 # nonnegative integer; default: 300. Previous tuning example: 192.
  #   inference_dtype: float32 # float32 | float16 | bfloat16; default: float32.
  #   export_confidence: false # true | false; default: false. Confidence cubes are converted to class labels before binary masking.
  #   softmax_output: true # true | false; default: true. Applies when export_confidence is enabled.
  #   no_data_value: 0 # number; default: 0. Inference-array nodata.
  #   apply_no_data_mask: true # true | false; default: true.
  #   custom_models: null # torch model/list | null; default: null. Live models are Python-only.
  #   pred_classes: 4 # positive integer; default: 4. Class count for custom models.
  #   destination_model_dir: null # path | null; default: null -> OmniCloudMask cache directory.
  #   model_download_source: hugging_face # hugging_face | google_drive; default: hugging_face.
  #   compile_models: false # true | false; default: false.
  #   compile_mode: default # default | reduce-overhead | max-autotune | max-autotune-no-cudagraphs; default: default.
  #   model_version: null # model version | null; default: null -> latest available. Examples: 1.0, 2.0, 3.0, 4.0.
  # param:log_to_console: false # true | false; default: false. Processing-function logs; core logging is separate.
  # param:scene_basename: var:basename # string | null; default: null. Explicit scene label for logs.
  core:calculate_overviews: true # true | false; default: false.

# Spatially match to an external image, LiDAR intensity raster or other reference dataset.
# Band indices for registration are zero-based.
alignment:
  plugin: alignment
  core:run: true # true | false; default: false. Enable this step.
  param:moving_image_path: var:current_image_paths # path; required. Cached image can satisfy this dependency directly.
  param:fixed_image_path: const:reference_path # path; required when alignment runs.
  var:suffix: expr:var.suffix & '_aligned'
  var:current_image_paths: expr:var.output_dir & '/' & var.basename & var.suffix & '.tif'
  param:output_image_path: var:current_image_paths # path; required.
  # param:band_index: 0 # zero-based integer; default: 0. Registration metric band when per-image overrides are null.
  param:moving_band_index: 0 # zero-based integer | null; default: null -> band_index.
  param:fixed_band_index: 0 # zero-based integer | null; default: null -> band_index.
  # param:moving_nodata: null # number | null; default: null -> raster metadata.
  # param:fixed_nodata: null # number | null; default: null -> raster metadata.
  # param:custom_nodata_value: -9999 # number | null; default: shared.custom_nodata_value (Python: null).
  # param:min_valid_fraction: 0.01 # (0,1]; default: 0.01. Required valid overlap fraction in registration ROI.
  # param:use_edge_proxies: true # true | false; default: true. Use edge imagery for registration.
  # param:split_factor: 0 # integer >= 0; default: 0. 0 disables chunking; k > 0 splits solve/apply domains into 2^k chunks.
  param:clip_fixed_to_moving: true # true | false; default: false. Clip the fixed domain to the moving footprint.
  # param:output_on_moving_grid: false # true | false; default: false.
  param:trim_edge_invalid: true # true | false; default: false. Trim alignment artifacts along irregular exterior boundaries.
  param:edge_trim_depth: 8 # positive pixels; default: 8.
  param:edge_trim_detection_band_index: 0 # zero-based integer; default: 0. Band used to detect edge artifacts.
  param:edge_trim_invalid_below: -3000 # number | null; default: null. Values <= threshold are invalid; example: -3000.
  # param:edge_trim_invalid_above: null # number | null; default: null. Values >= threshold are invalid; example: 65535.
  param:enforce_mutual_valid_mask: true # true | false; default: false. Require pixels valid in both registration images.
  # param:solve_resolution: null # positive CRS units | null; default: null. Optional solve pixel size; example: 2.0.
  param:temp_dir: const:temp_dir # path | null; default: null -> system temp. Explicitly use the workflow temp directory.
  # param:delete_temp_dir: false # true | false; default: shared.delete_temp_dir (Python: true).
  # param:log_to_console: false # true | false; default: false. Processing-function logs; core logging is separate.
  # param:scene_basename: var:basename # string | null; default: null. Explicit scene label for logs.
  core:calculate_overviews: true # true | false; default: false.


# SpectralMatch functions run in the order shown: matching -> footprints -> Markov -> mask -> merge.
# The final merge is last so the completed mosaic also determines the final metadata snapshot.
# Alternative algorithms and optional utilities are fully commented but retain their parameter catalogs.
# Uncomment an alternative block and replace the corresponding active stage; update its explicit input links.
# Multi-raster destinations are explicit lists for core reuse, validation, cleanup and HPC transfers.
# Native folder/glob/template shorthand remains available to direct Python calls.
# Core reuses explicit files; functions manage directory contents with resume_from_outputs.
setup_spectralmatch:
  core:run: true # true | false; default: false. Prepare shared polygon settings.
  core:scope: aggregate # scene | aggregate; default: scene.
  # Automatically inherited from shared.param: when accepted: custom_nodata_value,
  # output_dtype, window_scales, concurrent_processing_backend, window_size,
  # image_threads, io_threads, tile_threads, cache, dask_scheduler, calculation_dtype,
  # save_as_cog, debug_logs and resume_from_outputs. Commented shared settings use function defaults.
  # epsg is offered too, but SpectralMatch uses the input raster/vector CRS instead.
  # core: controls stay with VHR; core:calculate_overviews uses shared.param:window_scales.
  # Only state needed by later steps belongs in const:; ordinary settings remain param: values.
  const:spectralmatch.polygon_layer: seamline_metadata # Shared by footprint generation and seamline selection.
  const:spectralmatch.image_field_name: image_path # Shared by footprint generation, seamlines and masking.

# Jointly register overlapping imagery before matching.
joint_coregistration:
  plugin: joint_coregistration
  core:run: true # true | false; default: false. Enable this step.
  param:input_images: collect:current_image_paths # path list; required. Previous enabled image step.
  var:suffix: expr:var.suffix & '_coreg'
  var:current_image_paths: expr:const.temp_dir & '/joint_coregistration/' & var.basename & var.suffix & '.tif'
  param:output_images: collect:current_image_paths # path list | template/folder; required. Folder (writes '$_Coregistered.tif'), '$' basename template, or list[str] matching input order and length; output paths must be unique and differ from inputs.
  # param:tie_feature_method: "orb" # orb; default: "orb". 'orb', currently the only supported tie-point detector.
  # param:tie_grid_spacing: 500.0 # number; default: 500.0. Positive CRS-unit distance between search-window centers in each pair's overlap; default 500.0; independent of local_model and local_grid_spacing.
  # param:tie_search_radius: "128px" # string; default: "128px". Window half-width; positive number followed by px or crs
  # param:tie_orb_max_features: 100 # number; default: 100. Per image per search window
  # param:tie_max_matches_per_window: 1 # number; default: 1. Per image pair; null keeps all surviving matches
  # param:tie_maximum_displacement: null # number | null; default: null. Maximum displacement in CRS units; null disables the limit
  # param:tie_ransac_reprojection_threshold: null # number | null; default: null. CRS units; null uses three pixels at the coarser resolution
  # param:tie_robust_loss: "huber" # none | huber | soft_l1 | cauchy; default: "huber".
  # param:tie_robust_loss_scale: null # number | null; default: null. CRS units; null uses the median pair RANSAC threshold
  # param:tie_save_path: null # string | null; default: null. Selected ties in original zero-based pixel coordinates Example: /path/to/tie_points.json.
  # param:tie_save_crs_path: null # string | null; default: null. Paired points in the input CRS; GPKG or GeoJSON Example: /path/to/tie_points.gpkg.
  # param:tie_load_path: null # path | null; default: null. Saved tie pairs; use an existing file for workflow/HPC input checks.
  # param:global_model: "translation" # none | translation | similarity | affine; default: "translation".
  # param:global_image_movement_penalty_weights: null # object | null; default: null. Ordered basename-glob mapping to positive weights; first match wins; larger weights resist movement
  # param:global_tie_alignment_strength: 1.0 # number; default: 1.0. Number in [0, 1] for all images or JSON object string such as '{"base": 0, "*": 1}'; first wcmatch.glob basename match wins; unmatched names use 1; scales each image's solved global correction.
  # param:local_model: "piecewise_affine" # none | bilinear | piecewise_affine; default: "piecewise_affine".
  # param:local_image_movement_penalty_weights: null # object | null; default: null. Ordered basename-glob mapping to positive weights; first match wins; larger weights resist deformation
  # param:local_tie_alignment_strength: 1.0 # number; default: 1.0. Number in [0, 1] for all images or JSON object string such as '{"base": 0, "*": 1}'; first wcmatch.glob basename match wins; unmatched names use 1; scales each image's solved local displacement.
  # param:local_grid_spacing: 500.0 # number; default: 500.0. Positive target local deformation mesh spacing in CRS units; default 500.0; independent of tie-point search spacing.
  # param:local_smoothness_weight: 1.0 # number; default: 1.0. Non-negative number penalizing differences between neighboring node displacements; default 1.0.
  # param:local_bending_weight: 1.0 # number; default: 1.0. Non-negative number penalizing displacement curvature; default 1.0.
  # param:local_anchor_falloff_distance: 500.0 # number; default: 500.0. Positive CRS-unit distance controlling tie-point influence on mesh anchoring; default 500.0.
  # param:resampling_method: "bilinear" # nearest | bilinear | cubic | lanczos; default: "bilinear".
  # param:tap: false # true | false; default: false.
  # param:resolution: null # highest | average | lowest | positive CRS pixel size | null; default: null. Preserve native resolution; or highest | average | lowest | positive pixel size in CRS units
  # param:output_dtype: null # raster dtype | null; default: null. GDAL dtype name such as 'uint16' or 'float32'; None preserves each input dtype. Inherits shared.param:output_dtype when set.
  # param:custom_nodata_value: null # number | null; default: null. Numeric output NoData value; None preserves the detected input value. Inherits shared.param:custom_nodata_value when set.
  # param:window_size: null # positive integer | null; default: null. Positive int output tile size in pixels or None for native block size; COG output requires a multiple of 16. Inherits shared.param:window_size when set.
  # param:save_as_cog: false # true | false; default: false. bool, default False; write Cloud-Optimized GeoTIFF outputs. Inherits shared.param:save_as_cog when set.
  # param:build_overviews: false # true | false; default: false. Leave unset; VHR core calculates overviews.
  # param:window_scales: [2, 4, 8, 16, 32] # list; default: [2, 4, 8, 16, 32]. tuple[int, ...] of overview factors, default (2, 4, 8, 16, 32); None or () disables overview creation. Inherits shared.param:window_scales when set.
  # param:cache: null # positive GB | null; default: null. Positive number of gigabytes for the GDAL cache; None retains its current setting. Inherits shared.param:cache when set.
  # param:image_threads: null # cpu | positive integer | null; default: null. Positive int worker count, 'cpu' for all cores, or None for serial pair matching and output processing. Inherits shared.param:image_threads when set.
  # param:io_threads: null # cpu | positive integer | null; default: null. Positive int GDAL I/O worker count, 'cpu' for all cores, or None for its default. Inherits shared.param:io_threads when set.
  # param:tile_threads: null # cpu | positive integer | null; default: null. Positive int warp/tile worker count, 'cpu' for all cores, or None for serial processing. Inherits shared.param:tile_threads when set.
  # param:concurrent_processing_backend: "process_pool" # string; default: "process_pool". 'process_pool' (default) for local execution or 'dask' for an existing cluster. Inherits shared.param:concurrent_processing_backend when set.
  # param:dask_scheduler: null # [file, path] | [address, URL] | null; default: null. ('file', scheduler_json_path), ('address', 'tcp://host:port'), or None; required with the Dask backend. Inherits shared.param:dask_scheduler when set.
  # param:debug_logs: false # true | false; default: false. bool, default False; print processing details. Inherits shared.param:debug_logs when set.
  # param:resume_from_outputs: "no" # no | yes | validate; default: "no". 'no' (default) overwrites, 'yes' reuses existing outputs, or 'validate' reuses outputs that pass validation. Inherits shared.param:resume_from_outputs when set.

# Build footprints after radiometric matching so image identifiers match Markov inputs exactly.
seamline_metadata:
  plugin: seamline_metadata
  core:run: true # true | false; default: false. Enable this step.
  param:image_paths: collect:current_image_paths # path list; required. Ordered across imported records.
  param:metadata_records: collect:footprint_metadata # JSON object list; required. Same length as image_paths.
  const:footprints: expr:const.temp_dir & '/seamline_metadata/seamline_metadata.gpkg'
  param:output_path: const:footprints # path; required. Temporary input to seamlines; use a persistent path to keep it as a deliverable.
  param:layer: const:spectralmatch.polygon_layer # layer name; default: seamline_metadata. Previous example: footprints.
  param:image_field_name: const:spectralmatch.image_field_name # field name; default: image_path. Use the same field in SpectralMatch seamline options.
  # param:footprint_source: calculate_bounds # calculate_bounds | metadata; default: calculate_bounds. metadata uses mapped IMD corners; calculate_bounds polygonizes valid raster data.
  # param:calculate_bounds_eight_connected: true # true | false; default: true. 8-connected versus 4-connected polygonization.
  # param:epsg: 6635 # EPSG integer; default: shared.epsg (Python: 4326).
  # param:scene_total: null # integer | null; default: null -> input count for progress logs.
  param:reuse: true # true | false; default: false. Native record-level reuse for the footprint table.
  # param:log_to_console: false # true | false; default: false. Processing-function logs; core logging is separate.
  # param:concurrent_processing: 1 # positive integer | num_cpu; default: 1. Function workers; core scene scheduling is separate.
  # param:concurrent_processing_backend: process_pool # process_pool | dask; default: process_pool.
  # param:dask_scheduler_file: null # path | null; default: null.
  # param:dask_scheduler_address: null # address | null; default: null.

# Global radiometric regression between overlapping images.
global_regression:
  plugin: global_regression
  core:run: true # true | false; default: false. Enable this step.

name: Publish QGIS Plugin

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g., v1.2.3)"
        required: true

jobs:
  publish-qgis-plugin:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out the released version
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uploader dependencies
        run: python -m pip install --upgrade defusedxml

      - name: Validate the release version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          PACKAGE_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          TAG_VERSION=${RELEASE_TAG#v}
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi

      - name: Build the QGIS plugin
        run: python qgis_vhrharomize/build_plugin.py

      - name: Upload the plugin to the QGIS repository
        env:
          QGIS_USER: ${{ secrets.QGIS_USER }}
          QGIS_PASS: ${{ secrets.QGIS_PASS }}
        run: |
          python qgis_vhrharomize/plugin_upload.py \
            --username "$QGIS_USER" \
            --password "$QGIS_PASS" \
            qgis_vhrharomize.zip

# Example for already orthorectified Planet imagery with adjacent JSON metadata.
# Adapt the glob, metadata keys and band indices to the product you receive.
shared:
  plugin: shared
  core:run: true # true | false; default: false. Apply workflow-wide defaults.
  # core:protect_source_files: true # true | false; default: true. Protect imported originals and companion files.
  core:output_metadata_path: expr:var.output_dir & '/processing_metadata.json' # path/expression | null; default: null. Append final const/var snapshots to this JSON array.
  # core:delete_final_json_first: true # true | false; default: true. Replace old JSON on the first write to each resolved path; append subsequent completions.
  # core:processing_direction: vertical # horizontal | vertical; default: vertical. Advance each scene until a synchronization point; horizontal runs by step.
  # core:run_from_existing: true # true | false; default: true.
  # core:check_validity: true # true | false; default: true.
  param:custom_nodata_value: 0
  # core:log_to_console: true # true | false; default: true.
  # core:show_progress: true # true | false; default: true. Live prompt_toolkit dashboard; one final summary in redirected logs.
  # core:report_progress: false # true | false; default: false. Publish progress snapshots without a display; show_progress also enables this.
  # core:save_statistics_path: statistics.jsonl # path | null; default: statistics.jsonl beside this YAML. Append raw timings; null disables saving.
  # core:load_statistics_path: statistics.jsonl # path | null; default: statistics.jsonl beside this YAML. Seed ETAs from past timings; null disables loading.
  # Workflow-wide constants. They remain available to every scene and aggregate.
  const:reference_root: path:/path/to # Shared DEM/alignment directory.

  const:reference_path: expr:const.reference_root & '/reference.tif'
  const:red_band_index: 3 # one-based; recipe setting.
  const:green_band_index: 2 # one-based; recipe setting.
  const:nir_band_index: 4 # one-based; recipe setting.

discover_inputs:
  plugin: import_files
  # Explicit persistence only. Missing load files warn (when logs are on), then discovery continues.
  # To refresh from the original metadata, leave load_context commented during that run.
  # core:save_context:
  #   "path:./context/import_metadata.json": [defined, var.file_path, var.output_dir, var.metadata, const.temp_dir]
  # core:load_context:
  #   "path:./context/import_metadata.json": [defined, var.file_path, var.output_dir, var.metadata, const.temp_dir]
  # core:save_upsert_context: {"path:./context/metadata.json": [var.metadata]}
  # core:load_upsert_context: {"path:./context/metadata.json": [var.metadata]}
  # dependencies selects recursive param references; defined selects this step's assignments.
  # Use all instead of the selector list to save/load every context field.
  param:output_dir: literal:expr:$replace(var.file_path, /[^\/]+$/, '') & '../processed_planet' # path; default: ./output. Explicitly relative to each original input.
  param:temp_dir: path:sys # path; default: sys. Create one system temporary directory for this import.
  # param:temp_dir_scope: const # const | var; default: const. Share one temporary root across scenes.
  # param:output_dir_scope: var # const | var; default: var. Resolve an output root for each scene.
  core:run: true # true | false; default: false. Enable this step.
  param:search_glob: /path/to/planet/*_AnalyticMS_SR.tif
  var:reflectance: returned:file_path
  var:basename: expr:$replace($split(var.file_path, '/')[-1], /\.[^.]*$/, '')
  var:suffix: ""
  # literal:expr is evaluated by import_files once per discovered file.
  param:create_metadata_json: # name:{path: glob} | name:{to_json: file}; default: null.
    metadata:
      to_json: literal:expr:$replace(var.file_path, '_AnalyticMS_SR.tif', '_metadata.json')
  param:scene_id: literal:var:metadata.id # string/reference/expression; default: var:file_path. Match later imports by the metadata ID.
  var:acquisition_datetime_utc: var:metadata.properties.acquired
  var:cloud_cover: expr:100 * var.metadata.properties.cloud_cover

cloud_mask:
  plugin: cloud_mask
  core:run: true # true | false; default: false. Enable this step.
  core:require_outputs: [param:output_raster_path, param:output_mask_path] # Requested deliverables; upstream steps run as needed.
  param:input_image_path: var:reflectance
  var:suffix: expr:var.suffix & '_cloudmasked'
  var:cloudmasked: expr:var.output_dir & '/' & var.basename & var.suffix & '.tif'
  param:output_raster_path: var:cloudmasked
  var:cloudmask: expr:var.output_dir & '/' & var.basename & '_cloudmask.tif'
  param:output_mask_path: var:cloudmask
  param:red_band_index: const:red_band_index
  param:green_band_index: const:green_band_index
  param:nir_band_index: const:nir_band_index
alignment:
  plugin: alignment
  core:run: true # true | false; default: false. Enable this step.
  core:require_outputs: param:output_image_path # Requested deliverables; upstream steps run as needed.
  param:temp_dir: const:temp_dir
  param:moving_image_path: var:cloudmasked
  param:fixed_image_path: const:reference_path
  var:suffix: expr:var.suffix & '_aligned'
  var:aligned: expr:var.output_dir & '/' & var.basename & var.suffix & '.tif'
  param:output_image_path: var:aligned
  param:moving_band_index: expr:const.nir_band_index - 1
  param:fixed_band_index: 0

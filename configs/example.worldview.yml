  param:dn_to_radiance_factors: var:dn_to_radiance_factors # number list | null; default: null. Explicit per-band radiance calibration.
  param:dn_to_radiance_offsets: var:dn_to_radiance_offsets # number list | null; default: null. Explicit per-band radiance calibration.
  # To disable IMD calibration or gain/offset adjustment, change the metadata mapping above;

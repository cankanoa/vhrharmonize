# Set task ID
run_id: "1" # Unique ID for this run or set to previous ID to use previous files stored on remote host. Can be any string. If unset, a timestamp will be generated at runtime

# Editable files
workflow_config: configs/example.worldview.yml # Local workflow YAML to rewrite for Slurm
slurm_start_file: configs/example.slurm.sbatch # Local sbatch template to stage

# Generated files
staged_workflow_file: configs/{run_id}.staged.worldview.yml # Generated rewritten workflow YAML
staged_slurm_start_file: configs/{run_id}.staged.slurm.sbatch # Generated sbatch with {run_id} replaced
staged_hpc_file: configs/{run_id}.staged.hpc.yml # Generated staged HPC YAML
debug_logs: true # Print debug logs

# Download settings
# Declared output folders are downloaded recursively as one rsync group. Conflict policies apply per file within folders; missing tiles are downloaded on every run.
override_download_conflict: validate # no | yes | validate. Skip existing | overwrite | skip valid local files

# SSH login
ssh_host: koa.its.hawaii.edu
ssh_user: username
# ssh_private_key: ~/.ssh/id_ed25519 # Optional identity file

# Remote directories. Optional, {run_id} will be replaced with the run ID
enable_rsync_checksum: false # Compare file checksums during uploads instead of only size and modification time
remote_output_dir: ~/koa_scratch/vhrharmonize/run_{run_id}/output # Non-temp workflow outputs
remote_log_dir: ~/koa_scratch/vhrharmonize/run_{run_id}/logs # Slurm/stdout logs
remote_temp_dir: ~/koa_scratch/vhrharmonize/tmp # const:temp_dir products
remote_reference_dir: ~/koa_scratch/vhrharmonize/references # Shared reference files

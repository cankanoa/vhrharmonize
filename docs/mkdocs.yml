site_name: vhrharmonize
site_description: Sensor-neutral imagery preprocessing library and CLI documentation
site_url: https://vhrharmonize.sefa.ai/
repo_url: https://github.com/cankanoa/vhrharmonize
repo_name: cankanoa/vhrharmonize

docs_dir: .
site_dir: ../site

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Adding Plugins: getting-started/adding-plugins.md
      - Contributing: getting-started/contributing.md
  - CLI:
      - Commands: cli/commands.md
      - Workflow: cli/workflow.md
      - HPC: cli/hpc.md
  - Configuration:
      - Workflow Configuration: configuration/workflow-config.md
  - Pre-Processing Steps:
      - Py6S: pre-processing-steps/py6s.md
      - Plugin Workflow: pre-processing-steps/workflow.md
  - API Reference:
      - io.geospatial: api/io-geospatial.md
      - io.workflow_utils: api/io-workflow-utils.md
      - plugins.alignment: api/plugins-alignment.md
      - plugins.atmospheric_correction: api/plugins-atmospheric-correction.md
      - plugins.cloud_mask: api/plugins-cloud-mask.md
      - io.logging: api/io-logging.md
      - plugins.orthorectification: api/plugins-orthorectification.md
      - plugins.pansharpen: api/plugins-pansharpen.md
      - SpectralMatch functions: api/plugins-spectralmatch.md
      - io.metadata: api/io-metadata.md
      - workflow.engine: api/workflow-engine.md
      - workflow.api: api/workflow-api.md
      - Progress: api/progress.md
      - slurm: api/slurm.md
      - plugins.fetch_atmosphere: api/plugins-fetch-atmosphere.md
      - plugins.fetch_dem: api/plugins-fetch-dem.md
      - plugins.seamline_metadata: api/plugins-seamline-metadata.md
      - cli.functions: api/cli-functions.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_section_style: table
            members_order: source
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            filters:
              - "!^_"
